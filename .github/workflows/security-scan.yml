name: Security Scan

on:
    schedule:
        - cron: '0 15 * * *' # 毎日 JST 0:00 (UTC 15:00)
    workflow_dispatch:

permissions:
    contents: read
    packages: read
    security-events: write

jobs:
    # GHCRにプッシュしているカスタムイメージのスキャン
    scan-custom:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                image:
                    - django-api
                    - frontend
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Login to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Pull image
              run: |
                  docker pull ghcr.io/${{ github.repository }}/${{ matrix.image }}:release

            - name: Scan image
              uses: aquasecurity/trivy-action@0.35.0
              with:
                  image-ref: 'ghcr.io/${{ github.repository }}/${{ matrix.image }}:release'
                  format: 'table'
                  exit-code: '1'
                  severity: 'CRITICAL,HIGH'
                  ignore-unfixed: false

            # SARIF生成: MEDIUM以上の脆弱性をSecurityタブに報告
            # exit-code: '0' でワークフローの成否判定には影響させない
            - name: Generate SARIF for Security tab
              if: always()
              uses: aquasecurity/trivy-action@0.35.0
              with:
                  image-ref: 'ghcr.io/${{ github.repository }}/${{ matrix.image }}:release'
                  format: 'sarif'
                  output: 'trivy-${{ matrix.image }}.sarif'
                  severity: 'CRITICAL,HIGH,MEDIUM'
                  ignore-unfixed: false
                  exit-code: '0'

            - name: Upload to Security tab
              if: always()
              uses: github/codeql-action/upload-sarif@v4
              with:
                  sarif_file: 'trivy-${{ matrix.image }}.sarif'
                  category: '${{ matrix.image }}'
