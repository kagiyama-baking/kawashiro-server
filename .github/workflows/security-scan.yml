name: Security Scan

on:
    schedule:
        - cron: '0 15 * * *' # 毎日 JST 0:00 (UTC 15:00)
    workflow_dispatch:

permissions:
    contents: read
    packages: read
    security-events: write

jobs:
    # GHCRにプッシュしているカスタムイメージのスキャン
    scan-custom:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                image:
                    - reverse-proxy
                    - django-api
                    - backup
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Pull image
              run: |
                  docker pull ghcr.io/${{ github.repository }}/${{ matrix.image }}:release

            - name: Scan image
              uses: aquasecurity/trivy-action@0.28.0
              with:
                  image-ref: 'ghcr.io/${{ github.repository }}/${{ matrix.image }}:release'
                  format: 'table'
                  exit-code: '1'
                  severity: 'CRITICAL,HIGH'
                  ignore-unfixed: false

            # SARIF生成ステップ: MEDIUM以上の脆弱性をSecurityタブに報告
            # exit-code: '0' を明示的に設定し、前ステップのTRIVY_EXIT_CODE環境変数を
            # 継承しないようにする（SARIF報告用であり、ワークフローの成否判定には影響させない）
            - name: Generate SARIF for Security tab
              if: always()
              uses: aquasecurity/trivy-action@0.28.0
              with:
                  image-ref: 'ghcr.io/${{ github.repository }}/${{ matrix.image }}:release'
                  format: 'sarif'
                  output: 'trivy-${{ matrix.image }}.sarif'
                  severity: 'CRITICAL,HIGH,MEDIUM'
                  ignore-unfixed: false
                  exit-code: '0'

            - name: Upload to Security tab
              if: always()
              uses: github/codeql-action/upload-sarif@v3
              with:
                  sarif_file: 'trivy-${{ matrix.image }}.sarif'
                  category: '${{ matrix.image }}'

    # 公式イメージをそのまま使用しているサービスのスキャン
    scan-official:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: prometheus
                      image: prom/prometheus:latest
                    - name: grafana
                      image: grafana/grafana:latest
                    - name: loki
                      image: grafana/loki:latest
                    - name: promtail
                      image: grafana/promtail:latest
                    - name: immich-server
                      image: ghcr.io/immich-app/immich-server:release
                    - name: immich-machine-learning
                      image: ghcr.io/immich-app/immich-machine-learning:release
                    - name: immich-postgres
                      image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
                    - name: valkey
                      image: docker.io/valkey/valkey:8-bookworm
                    - name: node-exporter
                      image: prom/node-exporter:latest
                    - name: nginx-exporter
                      image: nginx/nginx-prometheus-exporter:latest
                    - name: tempo
                      image: grafana/tempo:latest
                    - name: cadvisor
                      image: gcr.io/cadvisor/cadvisor:latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Pull image
              run: |
                  docker pull ${{ matrix.image }}

            - name: Scan image
              uses: aquasecurity/trivy-action@0.28.0
              with:
                  image-ref: '${{ matrix.image }}'
                  format: 'table'
                  exit-code: '1'
                  severity: 'CRITICAL,HIGH'
                  ignore-unfixed: false

            - name: Generate SARIF for Security tab
              if: always()
              uses: aquasecurity/trivy-action@0.28.0
              with:
                  image-ref: '${{ matrix.image }}'
                  format: 'sarif'
                  output: 'trivy-${{ matrix.name }}.sarif'
                  severity: 'CRITICAL,HIGH,MEDIUM'
                  ignore-unfixed: false
                  exit-code: '0'

            - name: Upload to Security tab
              if: always()
              uses: github/codeql-action/upload-sarif@v3
              with:
                  sarif_file: 'trivy-${{ matrix.name }}.sarif'
                  category: '${{ matrix.name }}'
