name: PR checks (develop)

on:
  pull_request:
    branches: [develop]

jobs:
  # PRチェック用のメインジョブ
  pr-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # 全体のタイムアウトを設定

    steps:
      # ソースコードの取得
      - name: Checkout
        uses: actions/checkout@v4

      # ログディレクトリの準備（コンテナマウント用）
      - name: Prepare log directories
        run: |
          mkdir -p volumes/kawashiro-reverse-proxy/log/nginx
          mkdir -p volumes/kawashiro-test-web/log/nginx

      # Dockerイメージのビルド
      - name: Build Docker images
        run: docker compose build --pull

      # コンテナの起動
      - name: Start containers
        run: |
          docker compose up -d
          # 起動状態を確認
          docker compose ps

      # コンテナの準備完了を待機（最大30秒）
      - name: Wait for containers to be ready
        run: |
          echo "⏳ コンテナの準備完了を待機中..."
          
          # reverse-proxyの準備完了を待機
          for i in {1..30}; do
            if docker compose exec -T reverse-proxy nc -z localhost 8080 2>/dev/null; then
              echo "✅ reverse-proxy: 準備完了"
              break
            fi
            [ $i -eq 30 ] && { echo "❌ reverse-proxy: タイムアウト"; exit 1; }
            sleep 1
          done
          
          # test-webの準備完了を待機
          for i in {1..30}; do
            if docker compose exec -T test-web nc -z localhost 8080 2>/dev/null; then
              echo "✅ test-web: 準備完了"
              break
            fi
            [ $i -eq 30 ] && { echo "❌ test-web: タイムアウト"; exit 1; }
            sleep 1
          done

      # Nginx設定の構文チェック
      - name: Test Nginx configuration
        run: |
          echo "🔍 Nginx設定の構文チェック中..."
          
          # reverse-proxyの構文チェック
          docker compose exec -T reverse-proxy nginx -t
          
          # test-webの構文チェック
          docker compose exec -T test-web nginx -t
          
          echo "✅ Nginx設定の構文チェック: OK"

      # 基本的な疎通確認
      - name: Health check
        run: |
          echo "🏥 ヘルスチェック中..."
          
          # ヘルスエンドポイントの確認
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/health)
          if [ "$status" = "200" ]; then
            echo "✅ ヘルスチェック: OK (HTTP $status)"
          else
            echo "❌ ヘルスチェック: NG (HTTP $status)"
            exit 1
          fi

      # サブドメインルーティングの確認
      - name: Test subdomain routing
        run: |
          echo "🔀 サブドメインルーティングのテスト中..."
          
          # test.localhost → test-webへのルーティング確認
          status=$(curl --resolve test.localhost:80:127.0.0.1 \
                   -s -o /dev/null -w "%{http_code}" \
                   http://test.localhost/)
          
          if [ "$status" = "200" ]; then
            echo "✅ ルーティング: OK (test.localhost → test-web)"
          else
            echo "❌ ルーティング: NG (HTTP $status)"
            exit 1
          fi

      # Nginxの再起動テスト（ゼロダウンタイム確認）
      - name: Test graceful reload
        run: |
          echo "🔄 Nginx再起動テスト中..."
          
          # graceful reload実行
          docker compose exec -T reverse-proxy nginx -s reload
          
          # 再起動後の疎通確認
          sleep 2
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/health)
          
          if [ "$status" = "200" ]; then
            echo "✅ 再起動後の疎通確認: OK"
          else
            echo "❌ 再起動後の疎通確認: NG (HTTP $status)"
            exit 1
          fi

      # エラー時のデバッグ情報出力
      - name: Show logs on failure
        if: failure()
        run: |
          echo "📋 === エラー時のログ出力 ==="
          echo "\n--- reverse-proxy logs ---"
          docker compose logs reverse-proxy | tail -n 100
          echo "\n--- test-web logs ---"
          docker compose logs test-web | tail -n 100

      # 環境のクリーンアップ（常に実行）
      - name: Cleanup
        if: always()
        run: |
          docker compose down -v
          echo "🧹 クリーンアップ完了"