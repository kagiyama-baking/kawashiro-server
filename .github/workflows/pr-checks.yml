name: PR checks (develop)

on:
  pull_request:
    branches: [develop]

jobs:
  # PRチェック用のメインジョブ
  pr-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # 全体のタイムアウトを設定

    steps:
      # ソースコードの取得
      - name: Checkout
        uses: actions/checkout@v4

      # ログディレクトリの準備（コンテナマウント用）
      - name: Prepare log directories
        run: |
          mkdir -p volumes/kawashiro-reverse-proxy/log/nginx
          mkdir -p volumes/kawashiro-test-web/log/nginx
          # GitHub Actions環境での権限問題を解決
          chmod -R 777 volumes/

      # Dockerイメージのビルド
      - name: Build Docker images
        run: docker compose build --pull

      # コンテナの起動
      - name: Start containers
        run: |
          # test-webを先に起動
          docker compose up -d test-web
          sleep 5
          # reverse-proxyを起動
          docker compose up -d reverse-proxy
          # 起動状態を確認
          docker compose ps
          # ネットワーク情報を確認
          docker network ls
          docker network inspect kawashiro-proxy-network || true
          
          # コンテナ間の通信を確認
          echo "🔍 コンテナ間の通信テスト..."
          # test-webコンテナのIPアドレスを取得
          TEST_WEB_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' kawashiro-test-web)
          echo "test-web IP: $TEST_WEB_IP"
          
          # reverse-proxyからtest-webへの名前解決を確認
          docker exec kawashiro-reverse-proxy nslookup test-web || true
          docker exec kawashiro-reverse-proxy ping -c 1 test-web || true
          docker exec kawashiro-reverse-proxy ping -c 1 kawashiro-test-web || true

      # コンテナの準備完了を待機（最大60秒）
      - name: Wait for containers to be ready
        run: |
          echo "⏳ コンテナの準備完了を待機中..."
          
          # コンテナの状態を確認
          echo "🔍 コンテナの現在の状態:"
          docker compose ps
          
          # reverse-proxyの準備完了を待機
          echo "🔄 reverse-proxyの起動を待機中..."
          for i in {1..60}; do
            # コンテナの状態を確認 (docker inspectを使用)
            status=$(docker inspect -f '{{.State.Status}}' kawashiro-reverse-proxy 2>/dev/null || echo "unknown")
            echo "  [$i/60] コンテナ状態: $status"
            
            # running状態の場合はポートチェック
            if [ "$status" = "running" ]; then
              # nginxプロセスが実行中か確認
              if [ $i -eq 1 ] || [ $((i % 10)) -eq 0 ]; then
                echo "    nginxプロセス確認:"
                docker compose exec -T reverse-proxy ps aux | grep nginx || true
                echo "    リスニングポート:"
                docker compose exec -T reverse-proxy netstat -tlpn 2>/dev/null || docker compose exec -T reverse-proxy ss -tlpn 2>/dev/null || true
              fi
              
              if docker compose exec -T reverse-proxy nc -z localhost 8080 2>/dev/null; then
                echo "✅ reverse-proxy: 準備完了"
                break
              else
                echo "    ポート8080の確認中..."
              fi
            fi
            
            # タイムアウト時のデバッグ情報
            if [ $i -eq 60 ]; then
              echo "❌ reverse-proxy: タイムアウト"
              echo "📋 コンテナのログ:"
              docker compose logs reverse-proxy | tail -n 50
              echo "📋 nginxエラーログ:"
              docker compose exec -T reverse-proxy cat /var/log/nginx/error.log 2>/dev/null || true
              exit 1
            fi
            
            sleep 2
          done
          
          # test-webの準備完了を待機
          echo "🔄 test-webの起動を待機中..."
          for i in {1..60}; do
            # コンテナの状態を確認 (docker inspectを使用)
            status=$(docker inspect -f '{{.State.Status}}' kawashiro-test-web 2>/dev/null || echo "unknown")
            echo "  [$i/60] コンテナ状態: $status"
            
            # running状態の場合はポートチェック
            if [ "$status" = "running" ]; then
              # nginxプロセスが実行中か確認
              if [ $i -eq 1 ] || [ $((i % 10)) -eq 0 ]; then
                echo "    nginxプロセス確認:"
                docker compose exec -T test-web ps aux | grep nginx || true
                echo "    リスニングポート:"
                docker compose exec -T test-web netstat -tlpn 2>/dev/null || docker compose exec -T test-web ss -tlpn 2>/dev/null || true
              fi
              
              if docker compose exec -T test-web nc -z localhost 8080 2>/dev/null; then
                echo "✅ test-web: 準備完了"
                break
              else
                echo "    ポート8080の確認中..."
              fi
            fi
            
            # タイムアウト時のデバッグ情報
            if [ $i -eq 60 ]; then
              echo "❌ test-web: タイムアウト"
              echo "📋 コンテナのログ:"
              docker compose logs test-web | tail -n 50
              echo "📋 nginxエラーログ:"
              docker compose exec -T test-web cat /var/log/nginx/error.log 2>/dev/null || true
              exit 1
            fi
            
            sleep 2
          done

      # Nginx設定の構文チェック
      - name: Test Nginx configuration
        run: |
          echo "🔍 Nginx設定の構文チェック中..."
          
          # reverse-proxyの構文チェック
          docker compose exec -T reverse-proxy nginx -t
          
          # test-webの構文チェック
          docker compose exec -T test-web nginx -t
          
          echo "✅ Nginx設定の構文チェック: OK"

      # 基本的な疎通確認
      - name: Health check
        run: |
          echo "🏥 ヘルスチェック中..."
          
          # ヘルスエンドポイントの確認
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/health)
          if [ "$status" = "200" ]; then
            echo "✅ ヘルスチェック: OK (HTTP $status)"
          else
            echo "❌ ヘルスチェック: NG (HTTP $status)"
            exit 1
          fi

      # サブドメインルーティングの確認
      - name: Test subdomain routing
        run: |
          echo "🔀 サブドメインルーティングのテスト中..."
          
          # test.localhost → test-webへのルーティング確認
          status=$(curl --resolve test.localhost:80:127.0.0.1 \
                   -s -o /dev/null -w "%{http_code}" \
                   http://test.localhost/)
          
          if [ "$status" = "200" ]; then
            echo "✅ ルーティング: OK (test.localhost → test-web)"
          else
            echo "❌ ルーティング: NG (HTTP $status)"
            exit 1
          fi

      # Nginxの再起動テスト（ゼロダウンタイム確認）
      - name: Test graceful reload
        run: |
          echo "🔄 Nginx再起動テスト中..."
          
          # graceful reload実行
          docker compose exec -T reverse-proxy nginx -s reload
          
          # 再起動後の疎通確認
          sleep 2
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/health)
          
          if [ "$status" = "200" ]; then
            echo "✅ 再起動後の疎通確認: OK"
          else
            echo "❌ 再起動後の疎通確認: NG (HTTP $status)"
            exit 1
          fi

      # エラー時のデバッグ情報出力
      - name: Show logs on failure
        if: failure()
        run: |
          echo "📋 === エラー時のログ出力 ==="
          echo "\n--- reverse-proxy logs ---"
          docker compose logs reverse-proxy | tail -n 100
          echo "\n--- test-web logs ---"
          docker compose logs test-web | tail -n 100

      # 環境のクリーンアップ（常に実行）
      - name: Cleanup
        if: always()
        run: |
          docker compose down -v
          echo "🧹 クリーンアップ完了"