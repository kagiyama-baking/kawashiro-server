name: PR checks (develop)

on:
    pull_request:
        branches:
            - develop
        paths-ignore:
            - '.vscode/**'
            - '.claude/**'
            - '.gitignore'
            - '**/*.md'
            - '.github/workflows/!(pr-checks).yml'
            - 'scripts/**'
            - 'docs/**'
    workflow_dispatch: # テスト用の手動実行

jobs:
    # 変更検出ジョブ - 各サービスディレクトリの変更を検出
    detect-changes:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            django-api: ${{ steps.filter.outputs.django-api }}
            sbv2-api: ${{ steps.filter.outputs.sbv2-api }}
            frontend: ${{ steps.filter.outputs.frontend }}
            docker-compose: ${{ steps.filter.outputs.docker-compose }}
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Detect changes
              uses: dorny/paths-filter@v4
              id: filter
              with:
                  filters: |
                      django-api:
                        - 'django_api/**'
                      sbv2-api:
                        - 'sbv2_api/**'
                      frontend:
                        - 'frontend/**'
                      docker-compose:
                        - 'docker-compose.yml'
                        - '.env.sample'

    # Dockerfile静的解析ジョブ（セキュリティスキャン）
    dockerfile-security-scan:
        needs: detect-changes
        if: |
            needs.detect-changes.outputs.django-api == 'true' ||
            needs.detect-changes.outputs.sbv2-api == 'true' ||
            needs.detect-changes.outputs.frontend == 'true' ||
            github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: django-api
                      path: ./django_api
                      changed: django-api
                    - name: sbv2-api
                      path: ./sbv2_api
                      changed: sbv2-api
                    - name: frontend
                      path: ./frontend
                      changed: frontend
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Run Trivy config scan (${{ matrix.name }})
              if: needs.detect-changes.outputs[matrix.changed] == 'true' || github.event_name == 'workflow_dispatch'
              uses: aquasecurity/trivy-action@0.35.0
              with:
                  scan-type: 'config'
                  scan-ref: ${{ matrix.path }}
                  exit-code: '1'
                  severity: 'CRITICAL,HIGH'
                  format: 'table'

    # Django APIテストジョブ（django_apiに変更がある場合のみ実行）
    django-api-test:
        needs: detect-changes
        if: needs.detect-changes.outputs.django-api == 'true' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: '3.13'

            - name: Install uv
              run: |
                  pip install --upgrade pip
                  pip install uv

            - name: Install dependencies
              working-directory: ./django_api
              run: |
                  uv pip install --system .
                  uv pip install --system pytest pytest-django pytest-cov pytest-mock pytest-xdist factory-boy faker ruff

            - name: Run ruff (lint + format check)
              working-directory: ./django_api
              run: |
                  uv run ruff check .
                  uv run ruff format --check .

            - name: Create test environment
              working-directory: ./django_api
              run: |
                  # テスト用.envファイル作成（.env.sampleに準拠）
                  echo "SECRET_KEY=test-secret-key-for-ci-testing" > .env
                  echo "DEBUG=False" >> .env
                  echo "ALLOWED_HOSTS=localhost,testserver" >> .env
                  echo "ENCRYPTION_KEY=test-encryption-key-for-ci-testing" >> .env

            - name: Run tests with coverage
              working-directory: ./django_api
              env:
                  DJANGO_SETTINGS_MODULE: django_api.settings
              run: |
                  python -m pytest tests/ \
                    --cov=user --cov=core \
                    --cov=integrations --cov=features \
                    --cov-report=term-missing \
                    --cov-fail-under=80

    # フロントエンド静的チェック（lint/format/type-check を並列実行）
    frontend-static-checks:
        needs: detect-changes
        if: needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        strategy:
            fail-fast: false
            matrix:
                check:
                    - { name: 'ESLint', script: 'lint' }
                    - { name: 'Prettier', script: 'format:check' }
                    - { name: 'TypeScript', script: 'type-check' }
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: latest

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'pnpm'
                  cache-dependency-path: frontend/pnpm-lock.yaml

            - name: Install dependencies
              working-directory: ./frontend
              run: pnpm install --frozen-lockfile

            - name: Run ${{ matrix.check.name }}
              working-directory: ./frontend
              run: pnpm ${{ matrix.check.script }}

    # フロントエンドユニットテスト
    frontend-test:
        needs: [detect-changes, frontend-static-checks]
        if: needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: latest

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'pnpm'
                  cache-dependency-path: frontend/pnpm-lock.yaml

            - name: Install dependencies
              working-directory: ./frontend
              run: pnpm install --frozen-lockfile

            - name: Run unit tests with coverage
              working-directory: ./frontend
              run: pnpm test:ci

            - name: Build check
              working-directory: ./frontend
              run: pnpm build

    # PRチェック用のメインジョブ（いずれかのサービスに変更がある場合のみ実行）
    container-integration-tests:
        needs: detect-changes
        if: |
            needs.detect-changes.outputs.django-api == 'true' ||
            needs.detect-changes.outputs.docker-compose == 'true' ||
            github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            # ソースコードの取得
            - name: Checkout
              uses: actions/checkout@v6

            # CI環境用のDjango API環境変数ファイル作成
            - name: Create Django API .env file for CI
              run: |
                  cp django_api/.env.sample django_api/.env
                  echo "SECRET_KEY=test-secret-key-for-ci-environment" >> django_api/.env
                  echo "DEBUG=False" >> django_api/.env
                  echo "ALLOWED_HOSTS=localhost" >> django_api/.env
                  echo "ENCRYPTION_KEY=test-encryption-key-for-ci-environment" >> django_api/.env

            # 永続化ディレクトリの準備（コンテナマウント用）
            - name: Prepare volume directories
              run: |
                  sudo mkdir -p /opt/app/django-api/staticfiles
                  sudo chmod -R 777 /opt/app/

            # Dockerイメージのビルド
            - name: Build Docker images
              run: docker compose build --pull django-api

            # PostgreSQLの起動とマイグレーション確認
            - name: Test Django migrations
              run: |
                  echo "🔧 PostgreSQL起動 & Django マイグレーション確認..."
                  docker compose up -d --wait app-database
                  # CI環境用：rootユーザーで実行して権限問題を回避
                  docker compose run --rm -u root -w /django_api django-api sh -c "
                    python manage.py migrate --run-syncdb && \
                    python manage.py migrate --check
                  "
                  echo "✅ マイグレーション: OK"

            # Django API: 静的ファイル収集確認
            - name: Test Django collectstatic
              run: |
                  echo "📦 Django 静的ファイル収集確認..."
                  # システムPythonにインストールされたパッケージを使用（UV_SYSTEM_PYTHON=1が設定済み）
                  docker compose run --rm --no-deps -w /django_api django-api sh -c "python manage.py collectstatic --noinput --dry-run"
                  echo "✅ 静的ファイル: OK"

            # コンテナの起動
            - name: Start containers
              run: |
                  echo "🚀 コンテナ起動中..."
                  docker compose up -d django-api
                  docker compose ps

            # 準備完了待機（django-api）
            - name: Wait for readiness :django-api
              run: |
                  echo "🔍 Django API確認中..."
                  if ! curl -sf --retry 60 --retry-delay 1 --retry-connrefused \
                    http://localhost:8000/health/ > /dev/null; then
                    echo "❌ Django API準備確認タイムアウト"
                    docker compose logs django-api | tail -n 30
                    exit 1
                  fi
                  echo "✅ Django API準備完了"

            # Django API機能テスト
            - name: Django API functionality tests
              run: |
                  echo "🧪 Django API機能テスト実行中..."

                  # OpenAPIスキーマ確認
                  echo "  📄 OpenAPIスキーマ... (localhost:8000/schema/)"
                  content=$(curl -s http://localhost:8000/schema/ | head -n1)
                  if echo "$content" | grep -q "openapi"; then
                    echo "  ✅ スキーマ: OK"
                  else
                    echo "  ❌ スキーマ: NG"
                    exit 1
                  fi

                  # Swagger UI確認
                  echo "  🎨 Swagger UI... (localhost:8000/swagger/)"
                  status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/swagger/)
                  if [ "$status" = "200" ]; then
                    echo "  ✅ Swagger UI: OK"
                  else
                    echo "  ❌ Swagger UI: NG (HTTP $status)"
                    exit 1
                  fi

            # エラー時のデバッグ情報
            - name: Debug info on failure
              if: failure()
              run: |
                  echo "🚨 === デバッグ情報 ==="
                  echo "📋 コンテナ状態:"
                  docker compose ps
                  echo ""
                  echo "📋 django-api ログ:"
                  docker compose logs django-api | tail -n 50

            # 環境のクリーンアップ（常に実行）
            - name: Cleanup
              if: always()
              run: |
                  docker compose down -v
                  echo "🧹 クリーンアップ完了"
