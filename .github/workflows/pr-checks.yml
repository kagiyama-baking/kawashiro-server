name: PR checks (develop)

on:
    pull_request:
        branches: [develop]
        paths-ignore:
            - '.vscode/**'
            - '.claude/**'
            - '.gitignore'
            - '**/*.md'
    workflow_dispatch: # テスト用の手動実行

jobs:
    # PRチェック用のメインジョブ
    pr-checks:
        runs-on: ubuntu-latest
        timeout-minutes: 10 # 全体のタイムアウトを設定

        steps:
            # ソースコードの取得
            - name: Checkout
              uses: actions/checkout@v4

            # CI環境用の.envファイル作成
            - name: Create .env file for CI
              run: |
                  echo "# CI環境用のダミー環境変数" > .env
                  echo "DB_USERNAME=ci_user" >> .env
                  echo "DB_PASSWORD=ci_password" >> .env
                  echo "DB_DATABASE_NAME=ci_database" >> .env
                  echo "PUBLIC_SERVER_URL=http://album.localhost" >> .env
                  echo "IMMICH_LOG_LEVEL=verbose" >> .env
                  echo "TZ=Asia/Tokyo" >> .env

            # ログディレクトリの準備（コンテナマウント用）
            - name: Prepare log directories
              run: |
                  mkdir -p volumes/reverse-proxy/log/nginx
                  mkdir -p volumes/test-web/log/nginx
                  mkdir -p volumes/immich/data
                  mkdir -p volumes/immich/log
                  # GitHub Actions環境での権限問題を解決
                  chmod -R 777 volumes/

            # Dockerイメージのビルド
            - name: Build Docker images
              run: docker compose build --pull

            # 構文チェック（reverse-proxy）
            - name: Test configuration syntax (Nginx) :reverse-proxy
              run: |
                  echo "🔧 Nginx設定構文チェック..."
                  # CI環境ではrootユーザーで実行して権限問題を回避
                  docker compose run --rm --no-deps --user root reverse-proxy nginx -t
                  echo "✅ 構文チェック: OK"

            # 構文チェック（test-web）
            - name: Test configuration syntax (Nginx) :test-web
              run: |
                  echo "🔧 Nginx設定構文チェック..."
                  # CI環境ではrootユーザーで実行して権限問題を回避
                  docker compose run --rm --no-deps --user root test-web nginx -t
                  echo "✅ 構文チェック: OK"

            # コンテナの起動
            - name: Start containers
              run: |
                  echo "🚀 コンテナ起動中..."
                  docker compose up -d

                  echo "⏳ コンテナ準備完了待機中..."
                  sleep 10  # 初期化待ち

                  # コンテナ状態確認
                  echo "📋 コンテナ状態:"
                  docker compose ps

                  # 問題のあるコンテナのログを確認
                  echo "📄 reverse-proxy ログ:"
                  docker compose logs reverse-proxy | tail -n 20
                  echo "📄 test-web ログ:"
                  docker compose logs test-web | tail -n 20

            # 準備完了待機（reverse-proxy）
            - name: Wait for readiness :reverse-proxy
              run: |
                  # プロセス確認
                  echo "🔍 reverse-proxy確認中..."
                  for i in {1..20}; do
                    if docker exec reverse-proxy sh -c 'ps aux | grep nginx' | grep -v grep >/dev/null 2>&1; then
                      echo "✅ reverse-proxy準備完了"
                      break
                    fi
                    echo "  [$i/20] 待機中..."
                    sleep 2
                  done

            # 準備完了待機（test-web）
            - name: Wait for readiness :test-web
              run: |
                  # プロセス確認
                  echo "🔍 test-web確認中..."
                  for i in {1..20}; do
                    if docker exec test-web sh -c 'ps aux | grep nginx' | grep -v grep >/dev/null 2>&1; then
                      echo "✅ test-web準備完了"
                      break
                    fi
                    echo "  [$i/20] 待機中..."
                    sleep 2
                  done

            # リバースプロキシ機能テスト
            - name: Reverse proxy functionality tests
              run: |
                  echo "🧪 機能テスト実行中..."

                  # コンテナの状態確認
                  echo "📋 現在のコンテナ状態:"
                  docker compose ps

                  # ポートのリッスン状態確認
                  echo "🔍 ポート80のリッスン状態:"
                  netstat -tlnp | grep :80 || echo "ポート80はリッスンされていません"

                  # ヘルスエンドポイント確認
                  echo "  🏥 ヘルスチェック... (localhost/health)"
                  status=$(curl -v --max-time 10 -s -o /dev/null -w "%{http_code}" http://localhost/health 2>&1 | tee /tmp/curl_output.txt | tail -1)
                  if [ "$status" = "200" ]; then
                    echo "  ✅ ヘルス: OK"
                  else
                    echo "  ❌ ヘルス: NG (HTTP $status)"
                    echo "  詳細なエラー情報:"
                    cat /tmp/curl_output.txt
                    exit 1
                  fi

                  # サブドメインルーティング確認
                  echo "  🔀 ルーティング... (test.localhost -> localhost:8080)"
                  status=$(curl --max-time 10 --resolve test.localhost:80:127.0.0.1 -s -o /dev/null -w "%{http_code}" http://test.localhost/)
                  if [ "$status" = "200" ]; then
                    echo "  ✅ ルーティング: OK"
                  else
                    echo "  ❌ ルーティング: NG (HTTP $status)"
                    exit 1
                  fi

            # エラー時のデバッグ情報
            - name: Debug info on failure
              if: failure()
              run: |
                  echo "🚨 === デバッグ情報 ==="
                  echo "📋 コンテナ状態:"
                  docker compose ps
                  echo "\n📋 reverse-proxy ログ:"
                  docker compose logs reverse-proxy | tail -n 50
                  echo "\n📋 test-web ログ:"
                  docker compose logs test-web | tail -n 50

            # 環境のクリーンアップ（常に実行）
            - name: Cleanup
              if: always()
              run: |
                  docker compose down -v
                  echo "🧹 クリーンアップ完了"
