name: Build & Push (develop)

on:
    push:
        branches:
            - develop
        paths-ignore:
            - .vscode/**
            - .claude/**
            - .gitignore
            - README.md
    workflow_dispatch: # テスト用の手動実行

permissions:
    contents: read
    packages: write
    id-token: write # provenance / cosign に必要

concurrency:
    group: build-develop-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # developブランチへのプッシュ時のビルド・プッシュジョブ
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 30 # 全体のタイムアウトを設定
        strategy:
            matrix:
                service:
                    - name: reverse-proxy
                      context: reverse_proxy
                      dockerfile: Dockerfile
                      image: ghcr.io/${{ github.repository }}/kawashiro-reverse-proxy
                    - name: test-web
                      context: test_web
                      dockerfile: Dockerfile
                      image: ghcr.io/${{ github.repository }}/kawashiro-test-web

        steps:
            # ソースコードの取得
            - name: Checkout
              uses: actions/checkout@v4

            # マルチプラットフォームビルド用のQEMU設定
            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            # Buildxのセットアップ（高度なビルド機能用）
            - name: Set up Buildx
              uses: docker/setup-buildx-action@v3

            # GitHub Container Registryへのログイン
            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # Dockerイメージのメタデータ生成
            - name: Docker meta
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ matrix.service.image }}
                  tags: |
                      type=sha,format=short
                      type=raw,value=staging
                  labels: |
                      org.opencontainers.image.title=${{ matrix.service.name }}
                      org.opencontainers.image.description=Kawashiro ${{
                        matrix.service.name
                      }} container
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.created=${{ github.run_id }}

            # Dockerイメージのビルドとプッシュ
            - name: Build & Push
              id: build
              uses: docker/build-push-action@v6
              with:
                  context: ./${{ matrix.service.context }}
                  file: ./${{ matrix.service.context }}/${{ matrix.service.dockerfile }}
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  provenance: false # 後で別ジョブで付与

            # ビルド結果の確認
            - name: Build summary
              if: always()
              run: |
                  if [ "${{ steps.build.outcome }}" = "success" ]; then
                    echo "✅ ${{ matrix.service.name }}のビルド・プッシュ: 成功"
                    echo "📦 ダイジェスト: ${{ steps.build.outputs.digest }}"
                  else
                    echo "❌ ${{ matrix.service.name }}のビルド・プッシュ: 失敗"
                  fi

            # SBOMの生成（ソフトウェア部品表）
            - name: Generate SBOM (CycloneDX)
              uses: anchore/sbom-action@v0
              with:
                  image: ${{ matrix.service.image }}@${{ steps.build.outputs.digest }}
                  artifact-name: sbom-${{ matrix.service.name }}.spdx.json

            # SBOM生成結果の確認
            - name: SBOM generation summary
              if: always()
              run: |
                  echo "📋 ${{ matrix.service.name }}のSBOM生成完了"

            # ビルド証明の生成
            - name: Attest build provenance
              uses: actions/attest-build-provenance@v1
              with:
                  subject-name: ${{ matrix.service.image }}
                  subject-digest: ${{ steps.build.outputs.digest }}
                  push-to-registry: true

            # Provenance生成結果の確認
            - name: Provenance attestation summary
              if: always()
              run: |
                  echo "🔐 ${{ matrix.service.name }}のビルド証明生成完了"

            # ビルドダイジェストの出力
            - name: Output digest
              run: |
                  echo "📦 ${{ matrix.service.name }}のダイジェスト: ${{ steps.build.outputs.digest }}"
                  echo '${{ steps.build.outputs.digest }}' > digest.txt

            # ダイジェストアーティファクトのアップロード
            - name: Upload digest artifact
              uses: actions/upload-artifact@v4
              with:
                  name: digest-${{ matrix.service.name }}
                  path: digest.txt

            # 最終サマリー
            - name: Final summary
              if: always()
              run: |
                  echo "🎉 ${{ matrix.service.name }}の処理完了"
                  echo "   イメージ: ${{ matrix.service.image }}"
                  echo "   タグ: ${{ steps.meta.outputs.tags }}"
                  echo "   ダイジェスト: ${{ steps.build.outputs.digest }}"
                  echo "   SBOM: sbom-${{ matrix.service.name }}.spdx.json"
