name: Release (main)

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read
    packages: write

concurrency:
    group: release-main-${{ github.ref }}
    cancel-in-progress: true

env:
    REGISTRY: ghcr.io
    IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
    # GHCRにstagingタグのイメージが存在するか確認
    verify-images:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        strategy:
            fail-fast: true
            matrix:
                service:
                    - django-api
                    - backup
        steps:
            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Verify staging image (${{ matrix.service }})
              run: |
                  echo "🔍 ${{ matrix.service }}のstagingイメージを確認中..."
                  if docker manifest inspect "${{ env.IMAGE_BASE }}/${{ matrix.service }}:staging" > /dev/null 2>&1; then
                    echo "✅ ${{ matrix.service }}:staging イメージ確認OK"
                  else
                    echo "❌ ${{ matrix.service }}:staging イメージが見つかりません"
                    exit 1
                  fi

    # staging → release/latest リタグ
    tag-release:
        needs: verify-images
        runs-on: ubuntu-latest
        timeout-minutes: 10
        strategy:
            fail-fast: false
            matrix:
                service:
                    - django-api
                    - backup
        steps:
            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Re-tag staging → release/latest (${{ matrix.service }})
              run: |
                  IMAGE="${{ env.IMAGE_BASE }}/${{ matrix.service }}"
                  echo "🏷️ ${{ matrix.service }}: staging → release, latest"

                  # stagingイメージをpull
                  docker pull "${IMAGE}:staging"

                  # release/latestタグを付与してpush
                  docker tag "${IMAGE}:staging" "${IMAGE}:release"
                  docker tag "${IMAGE}:staging" "${IMAGE}:latest"
                  docker push "${IMAGE}:release"
                  docker push "${IMAGE}:latest"

                  echo "✅ ${{ matrix.service }}のリタグ完了"

    # リリースサマリー出力
    summary:
        needs: tag-release
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Release summary
              run: |
                  echo "🎉 リリース完了"
                  echo ""
                  echo "📦 リリースされたイメージ:"
                  echo "  - ${{ env.IMAGE_BASE }}/django-api:release"
                  echo "  - ${{ env.IMAGE_BASE }}/backup:release"
                  echo ""
                  echo "🔗 コミット: ${{ github.sha }}"
                  echo "📅 日時: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
