name: Deploy to Production

on:
    # mainブランチへのマージ時
    push:
        branches:
            - main
        paths-ignore:
            - .vscode/**
            - .claude/**
            - .gitignore
            - README.md
    # 手動実行
    workflow_dispatch:
        inputs:
            tag:
                description: 'デプロイするイメージタグ (デフォルト: staging)'
                required: false
                default: 'staging'
                type: string
            environment:
                description: 'デプロイ環境'
                required: true
                default: 'production'
                type: choice
                options:
                    - production
                    - staging

permissions:
    contents: read
    packages: read
    deployments: write

concurrency:
    group: deploy-${{ github.ref }}
    cancel-in-progress: false

jobs:
    # イメージの検証
    verify-images:
        runs-on: ubuntu-latest
        outputs:
            reverse-proxy-digest: ${{ steps.verify-reverse-proxy.outputs.digest }}
            test-web-digest: ${{ steps.verify-test-web.outputs.digest }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Verify reverse-proxy image
              id: verify-reverse-proxy
              run: |
                  TAG="${{ inputs.tag || 'staging' }}"
                  IMAGE="ghcr.io/${{ github.repository }}/reverse-proxy:${TAG}"

                  echo "🔍 reverse-proxyイメージの検証: ${IMAGE}"

                  # イメージの存在確認とダイジェスト取得
                  if docker manifest inspect ${IMAGE} > /dev/null 2>&1; then
                    DIGEST=$(docker manifest inspect ${IMAGE} | jq -r '.digest')
                    echo "✅ イメージが見つかりました"
                    echo "📦 ダイジェスト: ${DIGEST}"
                    echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
                  else
                    echo "❌ イメージが見つかりません: ${IMAGE}"
                    exit 1
                  fi

            - name: Verify test-web image
              id: verify-test-web
              run: |
                  TAG="${{ inputs.tag || 'staging' }}"
                  IMAGE="ghcr.io/${{ github.repository }}/test-web:${TAG}"

                  echo "🔍 test-webイメージの検証: ${IMAGE}"

                  # イメージの存在確認とダイジェスト取得
                  if docker manifest inspect ${IMAGE} > /dev/null 2>&1; then
                    DIGEST=$(docker manifest inspect ${IMAGE} | jq -r '.digest')
                    echo "✅ イメージが見つかりました"
                    echo "📦 ダイジェスト: ${DIGEST}"
                    echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
                  else
                    echo "❌ イメージが見つかりません: ${IMAGE}"
                    exit 1
                  fi

    # プロダクションタグの作成
    tag-production:
        runs-on: ubuntu-latest
        needs: verify-images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        steps:
            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Tag images as production
              run: |
                  # reverse-proxy
                  docker pull ghcr.io/${{ github.repository }}/reverse-proxy:staging
                  docker tag ghcr.io/${{ github.repository }}/reverse-proxy:staging \
                             ghcr.io/${{ github.repository }}/reverse-proxy:production
                  docker tag ghcr.io/${{ github.repository }}/reverse-proxy:staging \
                             ghcr.io/${{ github.repository }}/reverse-proxy:latest
                  docker push ghcr.io/${{ github.repository }}/reverse-proxy:production
                  docker push ghcr.io/${{ github.repository }}/reverse-proxy:latest

                  # test-web
                  docker pull ghcr.io/${{ github.repository }}/test-web:staging
                  docker tag ghcr.io/${{ github.repository }}/test-web:staging \
                             ghcr.io/${{ github.repository }}/test-web:production
                  docker tag ghcr.io/${{ github.repository }}/test-web:staging \
                             ghcr.io/${{ github.repository }}/test-web:latest
                  docker push ghcr.io/${{ github.repository }}/test-web:production
                  docker push ghcr.io/${{ github.repository }}/test-web:latest

                  echo "✅ プロダクションタグを作成しました"

    # デプロイ情報の生成
    deployment-info:
        runs-on: ubuntu-latest
        needs: [verify-images, tag-production]
        if: always() && needs.verify-images.result == 'success'
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Create deployment artifact
              run: |
                  TAG="${{ inputs.tag || 'staging' }}"
                  ENVIRONMENT="${{ inputs.environment || 'production' }}"

                  cat > deployment-info.json <<EOF
                  {
                    "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
                    "environment": "${ENVIRONMENT}",
                    "tag": "${TAG}",
                    "images": {
                      "reverse-proxy": {
                        "image": "ghcr.io/${{ github.repository }}/reverse-proxy:${TAG}",
                        "digest": "${{ needs.verify-images.outputs.reverse-proxy-digest }}"
                      },
                      "test-web": {
                        "image": "ghcr.io/${{ github.repository }}/test-web:${TAG}",
                        "digest": "${{ needs.verify-images.outputs.test-web-digest }}"
                      }
                    },
                    "git": {
                      "ref": "${{ github.ref }}",
                      "sha": "${{ github.sha }}",
                      "actor": "${{ github.actor }}"
                    }
                  }
                  EOF

                  echo "📋 デプロイ情報:"
                  cat deployment-info.json | jq '.'

            - name: Upload deployment artifact
              uses: actions/upload-artifact@v4
              with:
                  name: deployment-info
                  path: deployment-info.json

            - name: Generate deployment instructions
              run: |
                  TAG="${{ inputs.tag || 'staging' }}"

                  cat > DEPLOY_INSTRUCTIONS.md <<EOF
                  # デプロイ手順

                  ## 1. 本番サーバーで以下のコマンドを実行

                  \`\`\`bash
                  # リポジトリのクローンまたは更新
                  git clone https://github.com/${{ github.repository }}.git
                  # または
                  cd kawashiro-server && git pull

                  # 環境変数の設定
                  cp .env.production.example .env.production
                  # .env.production を編集して適切な値を設定

                  # デプロイスクリプトの実行
                  ./scripts/deploy.sh ${TAG}
                  \`\`\`

                  ## 2. 手動でデプロイする場合

                  \`\`\`bash
                  # イメージの取得
                  export GITHUB_REPOSITORY=${{ github.repository }}
                  docker compose -f docker-compose.production.yml pull

                  # サービスの更新
                  docker compose -f docker-compose.production.yml up -d

                  # ヘルスチェック
                  docker compose -f docker-compose.production.yml ps
                  \`\`\`

                  ## デプロイされるイメージ

                  - reverse-proxy: ghcr.io/${{ github.repository }}/reverse-proxy:${TAG}
                  - test-web: ghcr.io/${{ github.repository }}/test-web:${TAG}

                  EOF

                  echo "📝 デプロイ手順を生成しました"
                  cat DEPLOY_INSTRUCTIONS.md

            - name: Upload deployment instructions
              uses: actions/upload-artifact@v4
              with:
                  name: deployment-instructions
                  path: DEPLOY_INSTRUCTIONS.md

    # サマリー
    summary:
        runs-on: ubuntu-latest
        needs: [verify-images, tag-production, deployment-info]
        if: always()
        steps:
            - name: Generate summary
              run: |
                  TAG="${{ inputs.tag || 'staging' }}"
                  ENVIRONMENT="${{ inputs.environment || 'production' }}"

                  echo "# デプロイサマリー" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "## 🚀 デプロイ情報" >> $GITHUB_STEP_SUMMARY
                  echo "- **環境**: ${ENVIRONMENT}" >> $GITHUB_STEP_SUMMARY
                  echo "- **タグ**: ${TAG}" >> $GITHUB_STEP_SUMMARY
                  echo "- **実行者**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
                  echo "- **時刻**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY

                  echo "## 📦 イメージ" >> $GITHUB_STEP_SUMMARY
                  echo "| サービス | イメージ | ステータス |" >> $GITHUB_STEP_SUMMARY
                  echo "|----------|----------|------------|" >> $GITHUB_STEP_SUMMARY

                  if [ "${{ needs.verify-images.result }}" == "success" ]; then
                    echo "| reverse-proxy | ghcr.io/${{ github.repository }}/reverse-proxy:${TAG} | ✅ |" >> $GITHUB_STEP_SUMMARY
                    echo "| test-web | ghcr.io/${{ github.repository }}/test-web:${TAG} | ✅ |" >> $GITHUB_STEP_SUMMARY
                  else
                    echo "| - | - | ❌ 検証失敗 |" >> $GITHUB_STEP_SUMMARY
                  fi

                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "## 📋 次のステップ" >> $GITHUB_STEP_SUMMARY
                  echo "1. アーティファクトから \`deployment-instructions\` をダウンロード" >> $GITHUB_STEP_SUMMARY
                  echo "2. 手順に従って本番サーバーでデプロイを実行" >> $GITHUB_STEP_SUMMARY
                  echo "3. ヘルスチェックでサービスの正常性を確認" >> $GITHUB_STEP_SUMMARY