name: Deploy to Production

on:
    push:
        branches:
            - main
        paths-ignore:
            - '.vscode/**'
            - '.claude/**'
            - '.gitignore'
            - '**/*.md'
            - '.github/workflows/!(deploy).yml'
            - 'scripts/**'
            - 'docs/**'
    workflow_dispatch: # テスト用の手動実行
        inputs:
            tag:
                description: 'デプロイするイメージタグ (デフォルト: staging)'
                required: false
                default: 'staging'
                type: string
            environment:
                description: 'デプロイ環境'
                required: true
                default: 'production'
                type: choice
                options:
                    - production
                    - staging

permissions:
    contents: read
    packages: read
    deployments: write

concurrency:
    group: deploy-${{ github.ref }}
    cancel-in-progress: false

jobs:
    # イメージの検証
    verify-images:
        runs-on: ubuntu-latest
        outputs:
            reverse-proxy-digest: ${{ steps.verify-reverse-proxy.outputs.digest }}
            django-api-digest: ${{ steps.verify-django-api.outputs.digest }}
            backup-digest: ${{ steps.verify-backup.outputs.digest }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Verify reverse-proxy image
              id: verify-reverse-proxy
              run: |
                  TAG="${{ inputs.tag || 'staging' }}"
                  IMAGE="ghcr.io/${{ github.repository }}/reverse-proxy:${TAG}"

                  echo "🔍 reverse-proxyイメージの検証: ${IMAGE}"

                  # イメージの存在確認とダイジェスト取得
                  if docker manifest inspect ${IMAGE} > /dev/null 2>&1; then
                    DIGEST=$(docker manifest inspect ${IMAGE} | jq -r '.digest')
                    echo "✅ イメージが見つかりました"
                    echo "📦 ダイジェスト: ${DIGEST}"
                    echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
                  else
                    echo "❌ イメージが見つかりません: ${IMAGE}"
                    exit 1
                  fi

            - name: Verify django-api image
              id: verify-django-api
              run: |
                  TAG="${{ inputs.tag || 'staging' }}"
                  IMAGE="ghcr.io/${{ github.repository }}/django-api:${TAG}"

                  echo "🔍 django-apiイメージの検証: ${IMAGE}"

                  # イメージの存在確認とダイジェスト取得
                  if docker manifest inspect ${IMAGE} > /dev/null 2>&1; then
                    DIGEST=$(docker manifest inspect ${IMAGE} | jq -r '.digest')
                    echo "✅ イメージが見つかりました"
                    echo "📦 ダイジェスト: ${DIGEST}"
                    echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
                  else
                    echo "❌ イメージが見つかりません: ${IMAGE}"
                    exit 1
                  fi

            - name: Verify backup image
              id: verify-backup
              run: |
                  TAG="${{ inputs.tag || 'staging' }}"
                  IMAGE="ghcr.io/${{ github.repository }}/backup:${TAG}"

                  echo "🔍 backupイメージの検証: ${IMAGE}"

                  # イメージの存在確認とダイジェスト取得
                  if docker manifest inspect ${IMAGE} > /dev/null 2>&1; then
                    DIGEST=$(docker manifest inspect ${IMAGE} | jq -r '.digest')
                    echo "✅ イメージが見つかりました"
                    echo "📦 ダイジェスト: ${DIGEST}"
                    echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
                  else
                    echo "❌ イメージが見つかりません: ${IMAGE}"
                    exit 1
                  fi

    # リリースタグの作成
    tag-release:
        runs-on: ubuntu-latest
        needs: verify-images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        permissions:
            contents: read
            packages: write
        steps:
            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Tag images as release
              run: |
                  # reverse-proxy
                  docker pull ghcr.io/${{ github.repository }}/reverse-proxy:staging
                  docker tag ghcr.io/${{ github.repository }}/reverse-proxy:staging \
                             ghcr.io/${{ github.repository }}/reverse-proxy:release
                  docker tag ghcr.io/${{ github.repository }}/reverse-proxy:staging \
                             ghcr.io/${{ github.repository }}/reverse-proxy:latest
                  docker push ghcr.io/${{ github.repository }}/reverse-proxy:release
                  docker push ghcr.io/${{ github.repository }}/reverse-proxy:latest

                  # django-api
                  docker pull ghcr.io/${{ github.repository }}/django-api:staging
                  docker tag ghcr.io/${{ github.repository }}/django-api:staging \
                             ghcr.io/${{ github.repository }}/django-api:release
                  docker tag ghcr.io/${{ github.repository }}/django-api:staging \
                             ghcr.io/${{ github.repository }}/django-api:latest
                  docker push ghcr.io/${{ github.repository }}/django-api:release
                  docker push ghcr.io/${{ github.repository }}/django-api:latest

                  # backup
                  docker pull ghcr.io/${{ github.repository }}/backup:staging
                  docker tag ghcr.io/${{ github.repository }}/backup:staging \
                             ghcr.io/${{ github.repository }}/backup:release
                  docker tag ghcr.io/${{ github.repository }}/backup:staging \
                             ghcr.io/${{ github.repository }}/backup:latest
                  docker push ghcr.io/${{ github.repository }}/backup:release
                  docker push ghcr.io/${{ github.repository }}/backup:latest

                  echo "✅ リリースタグを作成しました"

    # 本番サーバーへデプロイ
    deploy:
        runs-on: ubuntu-latest
        needs: [verify-images, tag-release]
        if: always() && needs.verify-images.result == 'success' && (needs.tag-release.result == 'success' || needs.tag-release.result == 'skipped')
        environment: production
        steps:
            - name: Setup Tailscale
              uses: tailscale/github-action@v4
              with:
                  oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
                  oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
                  tags: tag:ci

            - name: Wait for Tailscale connection
              run: |
                  echo "⏳ Tailscale接続を待機中..."
                  sleep 5
                  tailscale status

            - name: Deploy to production server
              run: |
                  echo "🚀 本番サーバーへデプロイ開始..."

                  ssh -o StrictHostKeyChecking=accept-new \
                      -o ConnectTimeout=30 \
                      ${{ secrets.SSH_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'

                  set -e

                  cd /Users/hakotsuki/Repository/kawashiro-server

                  echo "📥 最新コードを取得..."
                  git fetch origin main
                  git reset --hard origin/main

                  echo "🐳 イメージを更新..."
                  docker compose -f docker-compose-prod.yml pull

                  echo "♻️ コンテナを再起動..."
                  docker compose -f docker-compose-prod.yml up -d --force-recreate

                  echo "🧹 古いイメージをクリーンアップ..."
                  docker image prune -f

                  echo "✅ デプロイ完了: $(date)"
                  ENDSSH

            - name: Health check
              run: |
                  echo "🏥 ヘルスチェック実行中..."
                  sleep 10

                  ssh -o StrictHostKeyChecking=accept-new \
                      -o ConnectTimeout=30 \
                      ${{ secrets.SSH_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'

                  cd /Users/hakotsuki/Repository/kawashiro-server
                  docker compose -f docker-compose-prod.yml ps

                  ENDSSH

    # サマリー
    summary:
        runs-on: ubuntu-latest
        needs: [verify-images, tag-release, deploy]
        if: always()
        steps:
            - name: Generate summary
              run: |
                  TAG="${{ inputs.tag || 'staging' }}"
                  ENVIRONMENT="${{ inputs.environment || 'production' }}"

                  echo "# デプロイサマリー" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "## 🚀 デプロイ情報" >> $GITHUB_STEP_SUMMARY
                  echo "- **環境**: ${ENVIRONMENT}" >> $GITHUB_STEP_SUMMARY
                  echo "- **タグ**: ${TAG}" >> $GITHUB_STEP_SUMMARY
                  echo "- **実行者**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
                  echo "- **時刻**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY

                  echo "## 📦 イメージ検証" >> $GITHUB_STEP_SUMMARY
                  echo "| サービス | ステータス |" >> $GITHUB_STEP_SUMMARY
                  echo "|----------|------------|" >> $GITHUB_STEP_SUMMARY

                  if [ "${{ needs.verify-images.result }}" == "success" ]; then
                    echo "| reverse-proxy | ✅ |" >> $GITHUB_STEP_SUMMARY
                    echo "| django-api | ✅ |" >> $GITHUB_STEP_SUMMARY
                    echo "| backup | ✅ |" >> $GITHUB_STEP_SUMMARY
                  else
                    echo "| - | ❌ 検証失敗 |" >> $GITHUB_STEP_SUMMARY
                  fi

                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "## 🖥️ デプロイ結果" >> $GITHUB_STEP_SUMMARY
                  if [ "${{ needs.deploy.result }}" == "success" ]; then
                    echo "✅ **本番サーバーへのデプロイが完了しました**" >> $GITHUB_STEP_SUMMARY
                  elif [ "${{ needs.deploy.result }}" == "skipped" ]; then
                    echo "⏭️ デプロイはスキップされました" >> $GITHUB_STEP_SUMMARY
                  else
                    echo "❌ **デプロイに失敗しました**" >> $GITHUB_STEP_SUMMARY
                  fi
