# album サブドメイン用設定（Immich）
server {
    listen 8080;
    server_name ~^album\..+$;

    # DockerのDNSリゾルバを指定（ipv6=off で外部DNSフォールバックを防止）
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Immichサーバーへのプロキシ
    location / {
        # 変数を使用して動的解決を有効化
        set $upstream_host immich;
        proxy_pass http://$upstream_host:2283;
        proxy_http_version 1.1;

        # ヘッダー設定
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocketサポート（Immichのライブ更新用）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # タイムアウト設定（大きなファイルアップロード用）
        client_max_body_size 1000M;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        send_timeout 600s;
    }
}

# api サブドメイン用設定（Django API）
server {
    listen 8080;
    server_name ~^api\..+$;

    # DockerのDNSリゾルバを指定（ipv6=off で外部DNSフォールバックを防止）
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Django APIサーバーへのプロキシ
    location / {
        # 変数を使用して動的解決を有効化
        set $upstream_host django-api;
        proxy_pass http://$upstream_host:8000;
        proxy_http_version 1.1;

        # ヘッダー設定
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS対応
        proxy_set_header Origin $http_origin;

        # 大容量ファイルアップロード対応
        client_max_body_size 10G;
        proxy_connect_timeout 300s;
        proxy_send_timeout 1200s;
        proxy_read_timeout 1200s;
    }

    # 静的ファイル用設定（必要に応じて）
    location /static/ {
        set $upstream_host django-api;
        proxy_pass http://$upstream_host:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 静的ファイルのキャッシュ設定
        proxy_cache_valid 200 302 10m;
        proxy_cache_valid 404 1m;
    }

    # メディアファイル用設定（必要に応じて）
    location /media/ {
        set $upstream_host django-api;
        proxy_pass http://$upstream_host:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 大容量ファイル対応
        client_max_body_size 10G;
        proxy_connect_timeout 300s;
        proxy_send_timeout 1200s;
        proxy_read_timeout 1200s;
    }
}

# デフォルトのリバースプロキシ設定（明示的にdefault_serverを指定）
server {
    listen 8080 default_server;
    server_name _;

    # ヘルスチェック用エンドポイント
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # カスタム404ページ
    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    # ドメイン名のみのアクセスは404を返す
    location / {
        return 404;
    }

    # サンプル：APIサーバーへのプロキシ
    # location /api {
    #     proxy_pass http://api:8080;
    #     proxy_http_version 1.1;
    #     
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # エラーページ設定
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}