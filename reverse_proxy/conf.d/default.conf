# デフォルトのリバースプロキシ設定
server {
    listen 80;
    server_name localhost;

    # ヘルスチェック用エンドポイント
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # サンプル：アプリケーションサーバーへのプロキシ
