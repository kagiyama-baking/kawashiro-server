services:
  nginx-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nginx-reverse-proxy
    ports:
      - "80:80"
      # HTTPS用（必要に応じてコメントアウトを解除）
      # - "443:443"
    volumes:
      # 設定ファイルのマウント（開発時用）
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      # ログの永続化
      - nginx_logs:/var/log/nginx
      # SSL証明書（必要に応じてコメントアウトを解除）
      # - ./ssl:/etc/nginx/ssl:ro
    restart: unless-stopped
    networks:
      - proxy-network

volumes:
  nginx_logs:
    driver: local

networks:
  proxy-network:
    driver: bridge
    name: kawashiro-proxy-network