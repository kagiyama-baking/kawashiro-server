<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>404 - ページが見つかりません</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont,
                    'Segoe UI', Roboto, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #fff;
                overflow: hidden;
            }

            .error-container {
                text-align: center;
                z-index: 10;
                position: relative;
            }

            .error-code {
                font-size: 12rem;
                font-weight: 900;
                line-height: 1;
                background: linear-gradient(
                    45deg,
                    #ff6b6b,
                    #4ecdc4,
                    #45b7d1,
                    #96ceb4,
                    #ffeaa7
                );
                background-size: 400% 400%;
                background-clip: text;
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                animation: gradientShift 3s ease-in-out infinite;
                margin-bottom: 1rem;
                text-shadow: 0 0 50px rgba(255, 255, 255, 0.1);
            }

            .error-message {
                font-size: 2rem;
                font-weight: 300;
                margin-bottom: 1rem;
                opacity: 0.9;
            }

            .error-description {
                font-size: 1.2rem;
                margin-bottom: 2rem;
                opacity: 0.7;
                max-width: 500px;
                margin-left: auto;
                margin-right: auto;
            }

            .home-button {
                display: inline-block;
                padding: 15px 40px;
                background: rgba(255, 255, 255, 0.2);
                border: 2px solid rgba(255, 255, 255, 0.3);
                border-radius: 50px;
                color: #fff;
                text-decoration: none;
                font-weight: 600;
                font-size: 1.1rem;
                transition: all 0.3s ease;
                backdrop-filter: blur(10px);
            }

            .home-button:hover {
                background: rgba(255, 255, 255, 0.3);
                border-color: rgba(255, 255, 255, 0.5);
                transform: translateY(-2px);
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            }

            .particles {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 1;
            }

            .particle {
                position: absolute;
                background: rgba(255, 255, 255, 0.1);
                border-radius: 50%;
                animation: float 6s ease-in-out infinite;
            }

            .floating-shapes {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                z-index: 2;
            }

            .shape {
                position: absolute;
                border-radius: 50%;
                background: rgba(255, 255, 255, 0.05);
                animation: drift 20s linear infinite;
            }

            .shape:nth-child(1) {
                width: 80px;
                height: 80px;
                top: 20%;
                left: 10%;
                animation-delay: 0s;
            }

            .shape:nth-child(2) {
                width: 120px;
                height: 120px;
                top: 60%;
                right: 15%;
                animation-delay: -5s;
            }

            .shape:nth-child(3) {
                width: 60px;
                height: 60px;
                bottom: 20%;
                left: 20%;
                animation-delay: -10s;
            }

            .shape:nth-child(4) {
                width: 100px;
                height: 100px;
                top: 30%;
                right: 30%;
                animation-delay: -15s;
            }

            @keyframes gradientShift {
                0%,
                100% {
                    background-position: 0% 50%;
                }
                50% {
                    background-position: 100% 50%;
                }
            }

            @keyframes float {
                0%,
                100% {
                    transform: translateY(0px) rotate(0deg);
                }
                33% {
                    transform: translateY(-20px) rotate(120deg);
                }
                66% {
                    transform: translateY(20px) rotate(240deg);
                }
            }

            @keyframes drift {
                0% {
                    transform: translateX(-100px) rotate(0deg);
                }
                100% {
                    transform: translateX(calc(100vw + 100px)) rotate(360deg);
                }
            }

            @media (max-width: 768px) {
                .error-code {
                    font-size: 8rem;
                }

                .error-message {
                    font-size: 1.5rem;
                }

                .error-description {
                    font-size: 1rem;
                    padding: 0 20px;
                }
            }

            .glitch {
                animation: glitch 2s infinite;
            }

            @keyframes glitch {
                0%,
                90%,
                100% {
                    transform: translate(0);
                }
                10% {
                    transform: translate(-1px, -1px);
                }
                20% {
                    transform: translate(1px, 1px);
                }
                30% {
                    transform: translate(-1px, 1px);
                }
                40% {
                    transform: translate(1px, -1px);
                }
                50% {
                    transform: translate(-1px, 1px);
                }
                60% {
                    transform: translate(1px, 1px);
                }
                70% {
                    transform: translate(-1px, -1px);
                }
                80% {
                    transform: translate(1px, -1px);
                }
            }
        </style>
    </head>
    <body>
        <div class="floating-shapes">
            <div class="shape"></div>
            <div class="shape"></div>
            <div class="shape"></div>
            <div class="shape"></div>
        </div>

        <div class="particles" id="particles"></div>

        <div class="error-container">
            <div class="error-code glitch">404</div>
            <h1 class="error-message">ページが見つかりません</h1>
            <a href="javascript:history.back()" class="home-button">
                ← 前のページに戻る
            </a>
        </div>

        <script>
            // パーティクル生成
            function createParticles() {
                const particlesContainer = document.getElementById('particles');
                const particleCount = 50;

                for (let i = 0; i < particleCount; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'particle';

                    const size = Math.random() * 4 + 1;
                    particle.style.width = size + 'px';
                    particle.style.height = size + 'px';
                    particle.style.left = Math.random() * 100 + '%';
                    particle.style.top = Math.random() * 100 + '%';
                    particle.style.animationDelay = Math.random() * 6 + 's';
                    particle.style.animationDuration =
                        Math.random() * 3 + 3 + 's';

                    particlesContainer.appendChild(particle);
                }
            }

            // ページ読み込み時にパーティクルを生成
            document.addEventListener('DOMContentLoaded', createParticles);

            // マウス移動でグラデーション効果
            document.addEventListener('mousemove', (e) => {
                const x = (e.clientX / window.innerWidth) * 100;
                const y = (e.clientY / window.innerHeight) * 100;

                document.body.style.background = `radial-gradient(circle at ${x}% ${y}%, #667eea 0%, #764ba2 100%)`;
            });
        </script>
    </body>
</html>
