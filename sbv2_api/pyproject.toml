[project]
name = "sbv2-api"
version = "1.0.0"
description = "Style-BERT-VITS2 読み上げAPIサーバー"
requires-python = ">=3.10"
# 注意: 実行時依存の style-bert-vits2 / torch / transformers は
# CPU/CUDA バリアント選択のため Dockerfile 側でインストールする。
# ここにはテスト実行に必要な軽量依存のみを記載する。
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pyyaml",
    "scipy",
    "numpy<2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".pytest_cache",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "PIE", # flake8-pie
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (日本語コメントを含むため)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
