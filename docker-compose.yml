services:
    # ============================================================
    # アプリケーションサービス
    # ============================================================

    # リバースプロキシサーバー
    reverse-proxy:
        build:
            context: ./reverse_proxy
            dockerfile: Dockerfile
        image: reverse-proxy
        container_name: reverse-proxy
        hostname: reverse-proxy
        ports:
            - '80:8080'
            # HTTPS用（必要に応じてコメントアウトを解除）
            # - "443:443"
        volumes:
            # ファイルのマウント
            - ./reverse_proxy/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./reverse_proxy/conf.d:/etc/nginx/conf.d:ro
            - ./reverse_proxy/html:/usr/share/nginx/html:ro
            # ログの永続化
            - ./volumes/reverse-proxy/log/nginx:/var/log/nginx
        restart: unless-stopped
        depends_on:
            - django-api
        networks:
            - proxy-network

    # Django APIサーバー
    django-api:
        build:
            context: ./django_api
            dockerfile: Dockerfile
        image: django-api
        container_name: django-api
        hostname: django-api
        env_file:
            - .env
        ports:
            # 開発環境用：直接アクセス
            - '8000:8000'
        volumes:
            # ソースコードのマウント（開発環境用）
            - ./django_api/manage.py:/django_api/manage.py
            - ./django_api/django_api:/django_api/django_api
            - ./django_api/core:/django_api/core
            - ./django_api/user:/django_api/user
            - ./django_api/onedrive:/django_api/onedrive
            - ./django_api/outlook:/django_api/outlook
            - ./django_api/media:/django_api/media
            - ./django_api/tts:/django_api/tts
            - ./django_api/weather:/django_api/weather
            - ./django_api/msgraph_config:/django_api/msgraph_config
            - ./django_api/greeting:/django_api/greeting
            - ./django_api/llm_config:/django_api/llm_config
            - ./django_api/llm_client:/django_api/llm_client
            - ./django_api/msgraph_client:/django_api/msgraph_client
            # 環境変数ファイル
            - ./django_api/.env:/django_api/.env
            # ログの永続化
            - ./volumes/django-api/log:/django_api/logs
            # 静的ファイルの永続化
            - ./volumes/django-api/staticfiles:/django_api/staticfiles
            # SQLiteデータベースの永続化
            - ./volumes/django-api/db.sqlite3:/django_api/db.sqlite3
        environment:
            # OpenTelemetry トレーシング設定
            OTEL_SERVICE_NAME: django-api
            OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
        restart: unless-stopped
        networks:
            - proxy-network
        command: >
            sh -c "python manage.py migrate &&
                   python manage.py runserver 0.0.0.0:8000"

    # Style-BERT-VITS2 読み上げAPI
    sbv2-api:
        build:
            context: ./sbv2_api
            dockerfile: Dockerfile
        image: sbv2-api
        container_name: sbv2-api
        hostname: sbv2-api
        volumes:
            # ソースコードのマウント（開発環境用）
            - ./sbv2_api/server.py:/app/server.py
            # 学習済みモデル（読み取り専用）
            - ./volumes/sbv2-api/model_assets:/app/model_assets:ro
            # 設定ファイル
            - ./sbv2_api/config.yml:/app/config.yml:ro
            # ログ
            - ./volumes/sbv2-api/log:/app/logs
        environment:
            - TZ=Asia/Tokyo
            - OMP_NUM_THREADS=4
            - MKL_NUM_THREADS=4
        restart: unless-stopped
        networks:
            - proxy-network
        # Intel Mac対応
        platform: linux/amd64

    # ============================================================
    # 監視・オブザーバビリティ
    # ============================================================

    # Prometheus - メトリクス収集サーバー
    # ※ 公式イメージをそのまま使用（設定ファイルはボリュームマウント）
    prometheus:
        image: prom/prometheus:v3.9.1
        container_name: prometheus
        hostname: prometheus
        ports:
            # 開発環境用：直接アクセス
            - '9090:9090'
        volumes:
            # 設定ファイルのマウント
            - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            # データの永続化
            - prometheus-data:/prometheus
        command:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--storage.tsdb.retention.time=30d'
            - '--web.console.libraries=/usr/share/prometheus/console_libraries'
            - '--web.console.templates=/usr/share/prometheus/consoles'
        healthcheck:
            test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s
        restart: unless-stopped
        networks:
            - proxy-network

    # Grafana - 監視ダッシュボード
    # ※ 公式イメージをそのまま使用（プロビジョニング設定はボリュームマウント）
    grafana:
        image: grafana/grafana:12.3.3
        container_name: grafana
        hostname: grafana
        env_file:
            - .env
        ports:
            # 開発環境用：直接アクセス
            - '3001:3000'
        volumes:
            # プロビジョニング設定のマウント
            - ./grafana/provisioning:/etc/grafana/provisioning:ro
            # データの永続化
            - grafana-data:/var/lib/grafana
        healthcheck:
            test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s
        restart: unless-stopped
        depends_on:
            - prometheus
            - loki
            - tempo
        networks:
            - proxy-network

    # Loki - ログ集約サーバー
    # ※ 公式イメージをそのまま使用（設定ファイルはボリュームマウント）
    loki:
        image: grafana/loki:3.6.6
        container_name: loki
        hostname: loki
        ports:
            # 開発環境用：直接アクセス
            - '3100:3100'
        volumes:
            # 設定ファイルのマウント
            - ./loki/loki.yml:/etc/loki/loki.yml:ro
            # データの永続化
            - loki-data:/loki
        command:
            - '-config.file=/etc/loki/loki.yml'
        # NOTE: Loki は distroless イメージのため healthcheck 設定不可
        restart: unless-stopped
        networks:
            - proxy-network

    # Tempo - 分散トレーシングバックエンド
    # ※ 公式イメージをそのまま使用（設定ファイルはボリュームマウント）
    tempo:
        image: grafana/tempo:2.10.1
        container_name: tempo
        hostname: tempo
        mem_limit: 256m
        memswap_limit: 256m
        environment:
            # Go ランタイムのソフトメモリ上限（mem_limitの約80%）
            # OOM Kill 前に GC が積極的にメモリを回収する
            GOMEMLIMIT: 200MiB
        ports:
            # 開発環境用：直接アクセス
            - '3200:3200'
        volumes:
            # 設定ファイルのマウント
            - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
            # データの永続化
            - tempo-data:/var/tempo
        command:
            - '-config.file=/etc/tempo/tempo.yml'
        # NOTE: Tempo 2.10+ は distroless イメージのため healthcheck 設定不可
        restart: unless-stopped
        networks:
            - proxy-network

    # Promtail - ログ収集エージェント
    # ※ 公式イメージをそのまま使用（設定ファイルはボリュームマウント）
    promtail:
        image: grafana/promtail:3.6.6
        container_name: promtail
        hostname: promtail
        volumes:
            # 設定ファイルのマウント
            - ./promtail/promtail.yml:/etc/promtail/promtail.yml:ro
            # Nginxログへのアクセス（読み取り専用）
            - ./volumes/reverse-proxy/log/nginx:/var/log/nginx:ro
            # Dockerソケット（コンテナログ自動収集用、読み取り専用）
            - /var/run/docker.sock:/var/run/docker.sock:ro
        command:
            - '-config.file=/etc/promtail/promtail.yml'
        # NOTE: Promtail は distroless イメージのため healthcheck 設定不可
        restart: unless-stopped
        depends_on:
            - loki
            - reverse-proxy
        networks:
            - proxy-network

    # Node Exporter - ホストマシンメトリクス収集
    node-exporter:
        image: prom/node-exporter:v1.10.2
        container_name: node-exporter
        hostname: node-exporter
        ports:
            # 開発環境用：直接アクセス
            - '9100:9100'
        volumes:
            - /sys:/host/sys:ro
            - /:/rootfs:ro
        command:
            - '--path.rootfs=/rootfs'
            - '--path.sysfs=/host/sys'
            - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|run|mnt)($$|/)'
            - '--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|erofs|sysfs|tracefs|9p)$$'
        healthcheck:
            # --spider は broken pipe を引き起こすため -O /dev/null で出力を破棄
            test: ["CMD-SHELL", "wget --quiet --tries=1 -O /dev/null http://localhost:9100/metrics || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s
        restart: unless-stopped
        networks:
            - proxy-network

    # Nginx Exporter - Nginxメトリクス収集
    nginx-exporter:
        image: nginx/nginx-prometheus-exporter:1.5.0
        container_name: nginx-exporter
        hostname: nginx-exporter
        ports:
            # 開発環境用：直接アクセス
            - '9113:9113'
        command:
            - '--nginx.scrape-uri=http://reverse-proxy:8080/stub_status'
        # NOTE: nginx-exporter は distroless イメージのため healthcheck 設定不可
        restart: unless-stopped
        depends_on:
            - reverse-proxy
        networks:
            - proxy-network

networks:
    proxy-network:
        driver: bridge
        name: proxy-network

volumes:
    prometheus-data:
        name: prometheus-data
    grafana-data:
        name: grafana-data
    loki-data:
        name: loki-data
    tempo-data:
        name: tempo-data
