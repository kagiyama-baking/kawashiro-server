services:
    # ============================================================
    # アプリケーションサービス
    # ============================================================

    # Django APIサーバー
    django-api:
        build:
            context: ./django_api
            dockerfile: Dockerfile
        image: django-api
        container_name: django
        hostname: django-api
        ports:
            # 開発環境用：直接アクセス
            - '8000:8000'
        volumes:
            # ソースコードのマウント（開発環境用）
            - ./django_api/manage.py:/django_api/manage.py
            - ./django_api/django_api:/django_api/django_api
            - ./django_api/core:/django_api/core
            - ./django_api/user:/django_api/user
            - ./django_api/integrations:/django_api/integrations
            - ./django_api/features:/django_api/features
            - ./django_api/health:/django_api/health
            # 環境変数ファイル
            - ./django_api/.env:/django_api/.env
            # 静的ファイルの永続化
            - /opt/app/django-api/staticfiles:/django_api/staticfiles
            # メディアファイル（チャット履歴の TTS 音声など）の永続化
            - ./volumes/media:/django_api/media
        restart: unless-stopped
        networks:
            - container-network
        depends_on:
            app-database:
                condition: service_healthy
            redis:
                condition: service_healthy
        command: >
            sh -c "python manage.py rename_app_migrations generate talk &&
                   python manage.py migrate &&
                   python manage.py collectstatic --noinput &&
                   python manage.py runserver 0.0.0.0:8000"

    # Celery ワーカー（バックグラウンドタスク実行）
    celery-worker:
        build:
            context: ./django_api
            dockerfile: Dockerfile
        image: django-api
        container_name: celery-worker
        hostname: celery-worker
        volumes:
            - ./django_api/manage.py:/django_api/manage.py
            - ./django_api/django_api:/django_api/django_api
            - ./django_api/core:/django_api/core
            - ./django_api/user:/django_api/user
            - ./django_api/integrations:/django_api/integrations
            - ./django_api/features:/django_api/features
            - ./django_api/health:/django_api/health
            - ./django_api/.env:/django_api/.env
        restart: unless-stopped
        networks:
            - container-network
        depends_on:
            app-database:
                condition: service_healthy
            redis:
                condition: service_healthy
        command: celery -A django_api worker -l info
        security_opt:
            - no-new-privileges:true

    # Celery Beat（定期タスクスケジューラ）
    celery-beat:
        build:
            context: ./django_api
            dockerfile: Dockerfile
        image: django-api
        container_name: celery-beat
        hostname: celery-beat
        volumes:
            - ./django_api/manage.py:/django_api/manage.py
            - ./django_api/django_api:/django_api/django_api
            - ./django_api/core:/django_api/core
            - ./django_api/user:/django_api/user
            - ./django_api/integrations:/django_api/integrations
            - ./django_api/features:/django_api/features
            - ./django_api/health:/django_api/health
            - ./django_api/.env:/django_api/.env
        restart: unless-stopped
        networks:
            - container-network
        depends_on:
            app-database:
                condition: service_healthy
            redis:
                condition: service_healthy
        command: celery -A django_api beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
        security_opt:
            - no-new-privileges:true

    # ============================================================
    # インフラサービス
    # ============================================================

    # Redis（Celeryブローカー）
    redis:
        image: redis:7-alpine
        container_name: redis
        hostname: redis
        restart: unless-stopped
        networks:
            - container-network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        cap_add:
            - SETGID
            - SETUID

    # PostgreSQL データベース（pgvector対応）
    app-database:
        image: pgvector/pgvector:pg17
        container_name: app-database
        hostname: app-database
        volumes:
            - app-db-data:/var/lib/postgresql/data
        environment:
            - POSTGRES_USER=kawashiro
            - POSTGRES_PASSWORD=kawashiro-dev
            - POSTGRES_DB=kawashiro
            - POSTGRES_INITDB_ARGS=--data-checksums
        restart: unless-stopped
        networks:
            - container-network
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -d kawashiro -U kawashiro"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        cap_add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - SETGID
            - SETUID

    # Style-BERT-VITS2 読み上げAPI（GPU版）
    sbv2-api:
        build:
            context: ./sbv2_api
            dockerfile: Dockerfile
        image: sbv2-api
        container_name: sbv2-api
        hostname: sbv2-api
        ports:
            - '5000:5000'
        volumes:
            # ソースコードのマウント（開発環境用）
            - ./sbv2_api/server.py:/app/server.py
            # 設定ファイル
            - ./sbv2_api/config.yml:/app/config.yml:ro
            # 学習済みモデル（読み取り専用）
            - /opt/app/sbv2-api/model_assets:/app/model_assets:ro
        environment:
            - TZ=Asia/Tokyo
            - NVIDIA_VISIBLE_DEVICES=all
        restart: unless-stopped
        networks:
            - container-network
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: 1
                          capabilities: [gpu]

    # フロントエンド（React SPA）
    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        image: frontend
        container_name: frontend
        hostname: frontend
        ports:
            - '3000:80'
        restart: unless-stopped
        networks:
            - container-network
        depends_on:
            - django-api

networks:
    container-network:
        driver: bridge
        name: container-network

volumes:
    app-db-data:
