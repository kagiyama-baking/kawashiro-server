services:
    # リバースプロキシサーバー
    reverse-proxy:
        build:
            context: ./reverse_proxy
            dockerfile: Dockerfile
        image: reverse-proxy
        container_name: reverse-proxy
        hostname: reverse-proxy
        ports:
            - '80:8080'
            # HTTPS用（必要に応じてコメントアウトを解除）
            # - "443:443"
        volumes:
            # ファイルのマウント
            - ./reverse_proxy/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./reverse_proxy/conf.d:/etc/nginx/conf.d:ro
            - ./reverse_proxy/html:/usr/share/nginx/html:ro
            # ログの永続化
            - ./volumes/reverse-proxy/log/nginx:/var/log/nginx
        restart: unless-stopped
        depends_on:
            - test-web
            - immich
        networks:
            - proxy-network

    # テスト用Webサーバー
    test-web:
        build:
            context: ./test_web
            dockerfile: Dockerfile
        image: test-web
        container_name: test-web
        hostname: test-web
        volumes:
            # ファイルのマウント
            - ./test_web/conf.d:/etc/nginx/conf.d:ro
            - ./test_web/html:/usr/share/nginx/html:ro
            # ログの永続化
            - ./volumes/test-web/log/nginx:/var/log/nginx
        restart: unless-stopped
        networks:
            - proxy-network

    # Immich - 写真管理サービス
    immich:
        image: ghcr.io/immich-app/immich-server:release
        container_name: immich
        hostname: immich
        environment:
            # Redisの接続設定
            REDIS_HOSTNAME: immich-redis
            # Postgresqlの接続設定
            DB_HOSTNAME: immich-postgres
            DB_USERNAME: immich
            DB_PASSWORD: immich
            DB_DATABASE_NAME: immich
            # サーバー設定
            PUBLIC_SERVER_URL: http://album.localhost
            IMMICH_LOG_LEVEL: verbose
        volumes:
            # アップロードファイルの永続化
            - ./volumes/immich/data:/data
            # ログディレクトリの作成（アプリケーションログ用）
            - ./volumes/immich/log:/logs
            # タイムゾーン設定
            - /etc/localtime:/etc/localtime:ro
        depends_on:
            - immich-redis
            - immich-postgres
        restart: unless-stopped
        networks:
            - proxy-network

    # Immich Machine Learning
    immich-machine-learning:
        image: ghcr.io/immich-app/immich-machine-learning:release
        container_name: immich-ml
        hostname: immich-ml
        environment:
            # Redisの接続設定
            REDIS_HOSTNAME: immich-redis
            # Postgresqlの接続設定
            DB_HOSTNAME: immich-postgres
            DB_USERNAME: immich
            DB_PASSWORD: immich
            DB_DATABASE_NAME: immich
        volumes:
            # モデルキャッシュの永続化
            - immich-ml-cache:/cache
        restart: unless-stopped
        networks:
            - proxy-network

    # Redis for Immich
    immich-redis:
        image: docker.io/valkey/valkey:8-bookworm
        container_name: immich-redis
        hostname: immich-redis
        healthcheck:
            test: redis-cli ping || exit 1
        volumes:
            # Redisデータの永続化
            - immich-redis-data:/data
        restart: unless-stopped
        networks:
            - proxy-network

    # PostgreSQL for Immich
    immich-postgres:
        image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
        container_name: immich-postgres
        hostname: immich-postgres
        environment:
            POSTGRES_PASSWORD: immich
            POSTGRES_USER: immich
            POSTGRES_DB: immich
            POSTGRES_INITDB_ARGS: '--data-checksums'
            # WSL2でのボリューム権限問題を回避
            PGDATA: /var/lib/postgresql/data/pgdata
        volumes:
            # PostgreSQLデータの永続化
            - immich-pgdata:/var/lib/postgresql/data
        restart: unless-stopped
        networks:
            - proxy-network

networks:
    proxy-network:
        driver: bridge
        name: proxy-network

volumes:
    immich-pgdata:
        name: immich-pgdata
    immich-redis-data:
        name: immich-redis-data
    immich-ml-cache:
        name: immich-ml-cache
