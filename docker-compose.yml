services:
    reverse-proxy:
        build:
            context: ./reverse_proxy
            dockerfile: Dockerfile
        image: kawashiro-reverse-proxy
        container_name: kawashiro-reverse-proxy
        hostname: kawashiro-reverse-proxy
        ports:
            - '80:8080'
            # HTTPS用（必要に応じてコメントアウトを解除）
            # - "443:443"
        volumes:
            # ファイルのマウント
            - ./reverse_proxy/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./reverse_proxy/conf.d:/etc/nginx/conf.d:ro
            - ./reverse_proxy/html:/usr/share/nginx/html:ro
            # ログの永続化
            - ./volumes/kawashiro-reverse-proxy/log/nginx:/var/log/nginx
        restart: unless-stopped
        depends_on:
            - test-web
        networks:
            - proxy-network

    test-web:
        build:
            context: ./test_web
            dockerfile: Dockerfile
        image: kawashiro-test-web
        container_name: kawashiro-test-web
        hostname: kawashiro-test-web
        volumes:
            # ファイルのマウント
            - ./test_web/conf.d:/etc/nginx/conf.d:ro
            - ./test_web/html:/usr/share/nginx/html:ro
            # ログの永続化
            - ./volumes/kawashiro-test-web/log/nginx:/var/log/nginx
        restart: unless-stopped
        networks:
            - proxy-network

networks:
    proxy-network:
        driver: bridge
        name: kawashiro-proxy-network
