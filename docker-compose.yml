services:
    sbv2-api:
        build:
            context: ./sbv2_api
            dockerfile: Dockerfile
        image: sbv2-api
        container_name: sbv2-api
        hostname: sbv2-api
        ports:
            - '5000:5000'
        volumes:
            # ソースコードのマウント（開発環境用）
            - ./sbv2_api/server.py:/app/server.py
            # 設定ファイル
            - ./sbv2_api/config.yml:/app/config.yml:ro
            # 学習済みモデル（読み取り専用）
            - /opt/app/sbv2-api/model_assets:/app/model_assets:ro
        environment:
            - TZ=Asia/Tokyo
            - NVIDIA_VISIBLE_DEVICES=all
        restart: unless-stopped
        networks:
            - container-network
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: 1
                          capabilities: [gpu]

networks:
    container-network:
        driver: bridge
        name: container-network
