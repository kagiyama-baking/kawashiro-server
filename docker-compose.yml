services:
    # リバースプロキシサーバー
    reverse-proxy:
        build:
            context: ./reverse_proxy
            dockerfile: Dockerfile
        image: reverse-proxy
        container_name: reverse-proxy
        hostname: reverse-proxy
        ports:
            - '80:8080'
            # HTTPS用（必要に応じてコメントアウトを解除）
            # - "443:443"
        volumes:
            # ファイルのマウント
            - ./reverse_proxy/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./reverse_proxy/conf.d:/etc/nginx/conf.d:ro
            - ./reverse_proxy/html:/usr/share/nginx/html:ro
            # ログの永続化
            - ./volumes/reverse-proxy/log/nginx:/var/log/nginx
        restart: unless-stopped
        depends_on:
            - test-web
            - django-api
            - immich
        networks:
            - proxy-network

    # テスト用Webサーバー
    test-web:
        build:
            context: ./test_web
            dockerfile: Dockerfile
        image: test-web
        container_name: test-web
        hostname: test-web
        ports:
            # 開発環境用：直接アクセス
            - '8081:80'
        volumes:
            # ファイルのマウント
            - ./test_web/conf.d:/etc/nginx/conf.d:ro
            - ./test_web/html:/usr/share/nginx/html:ro
            # ログの永続化
            - ./volumes/test-web/log/nginx:/var/log/nginx
        restart: unless-stopped
        networks:
            - proxy-network

    # Django APIサーバー
    django-api:
        build:
            context: ./django_api
            dockerfile: Dockerfile
        image: django-api
        container_name: django-api
        hostname: django-api
        env_file:
            - .env
        ports:
            # 開発環境用：直接アクセス
            - '8000:8000'
        volumes:
            # ソースコードのマウント（開発環境用）
            - ./django_api/manage.py:/django_api/manage.py
            - ./django_api/django_api:/django_api/django_api
            - ./django_api/core:/django_api/core
            - ./django_api/user:/django_api/user
            - ./django_api/onedrive:/django_api/onedrive
            - ./django_api/media:/django_api/media
            # 環境変数ファイル
            - ./django_api/.env:/django_api/.env
            # ログの永続化
            - ./volumes/django-api/log:/django_api/logs
            # 静的ファイルの永続化
            - ./volumes/django-api/staticfiles:/django_api/staticfiles
            # SQLiteデータベースの永続化
            - ./volumes/django-api/db.sqlite3:/django_api/db.sqlite3
        restart: unless-stopped
        networks:
            - proxy-network
        command: >
            sh -c "python manage.py migrate &&
                   python manage.py runserver 0.0.0.0:8000"

    # Immich - 写真管理サービス
    immich:
        image: ghcr.io/immich-app/immich-server:release
        container_name: immich
        hostname: immich
        environment:
            # Docker Composeサービス名を使用
            DB_HOSTNAME: immich-postgres
            REDIS_HOSTNAME: immich-redis
        env_file:
            - .env
        ports:
            # 開発環境用：直接アクセス
            - '2283:2283'
        volumes:
            # アップロードファイルの永続化
            - ./volumes/immich/data:/data
            # ログディレクトリの作成（アプリケーションログ用）
            - ./volumes/immich/log:/logs
            # タイムゾーン設定
            - /etc/localtime:/etc/localtime:ro
        depends_on:
            - immich-redis
            - immich-postgres
        restart: unless-stopped
        networks:
            - proxy-network

    # Immich Machine Learning
    immich-machine-learning:
        image: ghcr.io/immich-app/immich-machine-learning:release
        container_name: immich-ml
        hostname: immich-ml
        environment:
            # Docker Composeサービス名を使用
            DB_HOSTNAME: immich-postgres
            REDIS_HOSTNAME: immich-redis
        env_file:
            - .env
        volumes:
            # モデルキャッシュの永続化
            - immich-ml-cache:/cache
        restart: unless-stopped
        networks:
            - proxy-network

    # Redis for Immich
    immich-redis:
        image: docker.io/valkey/valkey:8-bookworm
        container_name: immich-redis
        hostname: immich-redis
        ports:
            # 開発環境用：直接アクセス
            - '6379:6379'
        healthcheck:
            test: redis-cli ping || exit 1
        volumes:
            # Redisデータの永続化
            - immich-redis-data:/data
        restart: unless-stopped
        networks:
            - proxy-network

    # PostgreSQL for Immich
    immich-postgres:
        image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
        container_name: immich-postgres
        hostname: immich-postgres
        environment:
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_DB: ${DB_DATABASE_NAME}
            POSTGRES_INITDB_ARGS: '--data-checksums'
        ports:
            # 開発環境用：直接アクセス
            - '5432:5432'
        volumes:
            # PostgreSQLデータの永続化
            - immich-pgdata:/var/lib/postgresql/data
        shm_size: 128mb
        restart: unless-stopped
        networks:
            - proxy-network

networks:
    proxy-network:
        driver: bridge
        name: proxy-network

volumes:
    immich-pgdata:
        name: immich-pgdata
    immich-redis-data:
        name: immich-redis-data
    immich-ml-cache:
        name: immich-ml-cache

secrets:
    django_api_graph_key:
        file: ./secrets/django_api_graph_key.pem
