services:
    # ============================================================
    # アプリケーションサービス
    # ============================================================

    # リバースプロキシサーバー
    reverse-proxy:
        build:
            context: ./reverse_proxy
            dockerfile: Dockerfile
        image: reverse-proxy
        container_name: reverse-proxy
        hostname: reverse-proxy
        ports:
            - '80:8080'
            # HTTPS用（必要に応じてコメントアウトを解除）
            # - "443:443"
        volumes:
            # ファイルのマウント
            - ./reverse_proxy/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./reverse_proxy/conf.d:/etc/nginx/conf.d:ro
            - ./reverse_proxy/html:/usr/share/nginx/html:ro
            # ログの永続化
            - ./volumes/reverse-proxy/log/nginx:/var/log/nginx
        restart: unless-stopped
        depends_on:
            - django-api
            - immich
        networks:
            - proxy-network

    # Django APIサーバー
    django-api:
        build:
            context: ./django_api
            dockerfile: Dockerfile
        image: django-api
        container_name: django-api
        hostname: django-api
        env_file:
            - .env
        ports:
            # 開発環境用：直接アクセス
            - '8000:8000'
        volumes:
            # ソースコードのマウント（開発環境用）
            - ./django_api/manage.py:/django_api/manage.py
            - ./django_api/django_api:/django_api/django_api
            - ./django_api/core:/django_api/core
            - ./django_api/user:/django_api/user
            - ./django_api/onedrive:/django_api/onedrive
            - ./django_api/outlook:/django_api/outlook
            - ./django_api/media:/django_api/media
            - ./django_api/tts:/django_api/tts
            - ./django_api/weather:/django_api/weather
            - ./django_api/msgraph_config:/django_api/msgraph_config
            - ./django_api/greeting:/django_api/greeting
            - ./django_api/llm_config:/django_api/llm_config
            - ./django_api/llm_client:/django_api/llm_client
            - ./django_api/msgraph_client:/django_api/msgraph_client
            # 環境変数ファイル
            - ./django_api/.env:/django_api/.env
            # ログの永続化
            - ./volumes/django-api/log:/django_api/logs
            # 静的ファイルの永続化
            - ./volumes/django-api/staticfiles:/django_api/staticfiles
            # SQLiteデータベースの永続化
            - ./volumes/django-api/db.sqlite3:/django_api/db.sqlite3
        restart: unless-stopped
        networks:
            - proxy-network
        command: >
            sh -c "python manage.py migrate &&
                   python manage.py runserver 0.0.0.0:8000"

    # Immich - 写真管理サービス
    immich:
        image: ghcr.io/immich-app/immich-server:release
        container_name: immich
        hostname: immich
        environment:
            # Docker Composeサービス名を使用
            DB_HOSTNAME: immich-postgres
            REDIS_HOSTNAME: immich-redis
        env_file:
            - .env
        ports:
            # 開発環境用：直接アクセス
            - '2283:2283'
        volumes:
            # アップロードファイルの永続化
            - ./volumes/immich/data:/data
            # ログディレクトリの作成（アプリケーションログ用）
            - ./volumes/immich/log:/logs
            # タイムゾーン設定
            - /etc/localtime:/etc/localtime:ro
        depends_on:
            - immich-redis
            - immich-postgres
        restart: unless-stopped
        networks:
            - proxy-network

    # Immich Machine Learning
    immich-machine-learning:
        image: ghcr.io/immich-app/immich-machine-learning:release
        container_name: immich-ml
        hostname: immich-ml
        environment:
            # Docker Composeサービス名を使用
            DB_HOSTNAME: immich-postgres
            REDIS_HOSTNAME: immich-redis
        env_file:
            - .env
        volumes:
            # モデルキャッシュの永続化
            - immich-ml-cache:/cache
        restart: unless-stopped
        networks:
            - proxy-network

    # Redis for Immich
    immich-redis:
        image: docker.io/valkey/valkey:8-bookworm
        container_name: immich-redis
        hostname: immich-redis
        ports:
            # 開発環境用：直接アクセス
            - '6379:6379'
        healthcheck:
            test: redis-cli ping || exit 1
        volumes:
            # Redisデータの永続化
            - immich-redis-data:/data
        restart: unless-stopped
        networks:
            - proxy-network

    # PostgreSQL for Immich
    immich-postgres:
        image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
        container_name: immich-postgres
        hostname: immich-postgres
        environment:
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_DB: ${DB_DATABASE_NAME}
            POSTGRES_INITDB_ARGS: '--data-checksums'
        ports:
            # 開発環境用：直接アクセス
            - '5432:5432'
        volumes:
            # PostgreSQLデータの永続化
            - immich-pgdata:/var/lib/postgresql/data
        shm_size: 128mb
        restart: unless-stopped
        networks:
            - proxy-network

    # Style-BERT-VITS2 読み上げAPI
    sbv2-api:
        build:
            context: ./sbv2_api
            dockerfile: Dockerfile
        image: sbv2-api
        container_name: sbv2-api
        hostname: sbv2-api
        volumes:
            # ソースコードのマウント（開発環境用）
            - ./sbv2_api/server.py:/app/server.py
            # 学習済みモデル（読み取り専用）
            - ./volumes/sbv2-api/model_assets:/app/model_assets:ro
            # 設定ファイル
            - ./sbv2_api/config.yml:/app/config.yml:ro
            # ログ
            - ./volumes/sbv2-api/log:/app/logs
        environment:
            - TZ=Asia/Tokyo
            - OMP_NUM_THREADS=4
            - MKL_NUM_THREADS=4
        restart: unless-stopped
        networks:
            - proxy-network
        # Intel Mac対応
        platform: linux/amd64

    # ============================================================
    # 監視・オブザーバビリティ
    # ============================================================

    # Prometheus - メトリクス収集サーバー
    # ※ 公式イメージをそのまま使用（設定ファイルはボリュームマウント）
    prometheus:
        image: prom/prometheus:latest
        container_name: prometheus
        hostname: prometheus
        ports:
            # 開発環境用：直接アクセス
            - '9090:9090'
        volumes:
            # 設定ファイルのマウント
            - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            # データの永続化
            - prometheus-data:/prometheus
        command:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--storage.tsdb.retention.time=30d'
            - '--web.console.libraries=/usr/share/prometheus/console_libraries'
            - '--web.console.templates=/usr/share/prometheus/consoles'
        restart: unless-stopped
        networks:
            - proxy-network

    # Grafana - 監視ダッシュボード
    # ※ 公式イメージをそのまま使用（プロビジョニング設定はボリュームマウント）
    grafana:
        image: grafana/grafana:latest
        container_name: grafana
        hostname: grafana
        env_file:
            - .env
        ports:
            # 開発環境用：直接アクセス
            - '3001:3000'
        volumes:
            # プロビジョニング設定のマウント
            - ./grafana/provisioning:/etc/grafana/provisioning:ro
            # データの永続化
            - grafana-data:/var/lib/grafana
        restart: unless-stopped
        depends_on:
            - prometheus
            - loki
        networks:
            - proxy-network

    # Loki - ログ集約サーバー
    # ※ 公式イメージをそのまま使用（設定ファイルはボリュームマウント）
    loki:
        image: grafana/loki:latest
        container_name: loki
        hostname: loki
        ports:
            # 開発環境用：直接アクセス
            - '3100:3100'
        volumes:
            # 設定ファイルのマウント
            - ./loki/loki.yml:/etc/loki/loki.yml:ro
            # データの永続化
            - loki-data:/loki
        command:
            - '-config.file=/etc/loki/loki.yml'
        restart: unless-stopped
        networks:
            - proxy-network

    # Promtail - ログ収集エージェント
    # ※ 公式イメージをそのまま使用（設定ファイルはボリュームマウント）
    promtail:
        image: grafana/promtail:latest
        container_name: promtail
        hostname: promtail
        volumes:
            # 設定ファイルのマウント
            - ./promtail/promtail.yml:/etc/promtail/promtail.yml:ro
            # Nginxログへのアクセス（読み取り専用）
            - ./volumes/reverse-proxy/log/nginx:/var/log/nginx:ro
            # Dockerソケット（コンテナログ自動収集用）
            - /var/run/docker.sock:/var/run/docker.sock
        command:
            - '-config.file=/etc/promtail/promtail.yml'
        restart: unless-stopped
        depends_on:
            - loki
            - reverse-proxy
        networks:
            - proxy-network

    # Node Exporter - ホストマシンメトリクス収集
    node-exporter:
        image: prom/node-exporter:latest
        container_name: node-exporter
        hostname: node-exporter
        ports:
            # 開発環境用：直接アクセス
            - '9100:9100'
        volumes:
            - /proc:/host/proc:ro
            - /sys:/host/sys:ro
            - /:/rootfs:ro
        command:
            - '--path.procfs=/host/proc'
            - '--path.rootfs=/rootfs'
            - '--path.sysfs=/host/sys'
            - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
        restart: unless-stopped
        networks:
            - proxy-network

    # Nginx Exporter - Nginxメトリクス収集
    nginx-exporter:
        image: nginx/nginx-prometheus-exporter:latest
        container_name: nginx-exporter
        hostname: nginx-exporter
        ports:
            # 開発環境用：直接アクセス
            - '9113:9113'
        command:
            - '--nginx.scrape-uri=http://reverse-proxy:8080/stub_status'
        restart: unless-stopped
        depends_on:
            - reverse-proxy
        networks:
            - proxy-network

networks:
    proxy-network:
        driver: bridge
        name: proxy-network

volumes:
    immich-pgdata:
        name: immich-pgdata
    immich-redis-data:
        name: immich-redis-data
    immich-ml-cache:
        name: immich-ml-cache
    prometheus-data:
        name: prometheus-data
    grafana-data:
        name: grafana-data
    loki-data:
        name: loki-data
