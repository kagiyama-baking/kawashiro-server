# Tempo データソースの自動プロビジョニング設定
apiVersion: 1

datasources:
  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    uid: tempo-datasource
    isDefault: false
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki-datasource
        filterByTraceID: true
        filterBySpanID: false
      tracesToMetrics:
        datasourceUid: PBFA97CFB590B2093
      serviceMap:
        datasourceUid: PBFA97CFB590B2093
      nodeGraph:
        enabled: true
