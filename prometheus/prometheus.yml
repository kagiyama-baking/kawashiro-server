# Prometheus設定ファイル
# メトリクス収集の対象とスクレイプ間隔を定義

global:
  scrape_interval: 15s      # メトリクス収集間隔
  evaluation_interval: 15s  # ルール評価間隔
  scrape_timeout: 10s       # スクレイプタイムアウト

scrape_configs:
  # Prometheus自身のメトリクス
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: "prometheus"

  # cAdvisor（Dockerコンテナメトリクス）
  # ※本番環境のみ有効（開発環境ではcAdvisorを起動しないためスクレイプ失敗するが影響なし）
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          service: "cadvisor"

  # Node Exporter（ホストマシンメトリクス）
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: "node-exporter"

  # Nginx Exporter（Nginxメトリクス）
  - job_name: "nginx-exporter"
    static_configs:
      - targets: ["nginx-exporter:9113"]
        labels:
          service: "nginx"

  # Django API（django-prometheusアプリケーションメトリクス）
  - job_name: "django-api"
    static_configs:
      - targets: ["django-api:8000"]
        labels:
          service: "django-api"
    metrics_path: "/metrics"

  # Tempo（トレーシングバックエンドの自己メトリクス）
  - job_name: "tempo"
    static_configs:
      - targets: ["tempo:3200"]
        labels:
          service: "tempo"

  # Grafana（Grafanaメトリクス）
  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          service: "grafana"
