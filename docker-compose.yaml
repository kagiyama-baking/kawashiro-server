services:
    reverse-proxy:
        build:
            context: ./reverse_proxy
            dockerfile: Dockerfile
        image: kawashiro-reverse-proxy
        container_name: kawashiro-reverse-proxy
        ports:
            - '80:80'
            # HTTPS用（必要に応じてコメントアウトを解除）
            # - "443:443"
        volumes:
            # 設定ファイルのマウント（開発時用）
            - ./reverse_proxy/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./reverse_proxy/conf.d:/etc/nginx/conf.d:ro
            # カスタム404ページ
            - ./reverse_proxy/html:/usr/share/nginx/html:ro
            # ログの永続化
            - nginx_logs:/var/log/nginx
            # SSL証明書（必要に応じてコメントアウトを解除）
            # - ./ssl:/etc/nginx/ssl:ro
        restart: unless-stopped
        networks:
            - proxy-network

    test-web:
        build:
            context: ./test_web
            dockerfile: Dockerfile
        image: kawashiro-test-web
        container_name: kawashiro-test-web
        ports:
            - '8080:80'
        restart: unless-stopped
        networks:
            - proxy-network

volumes:
    nginx_logs:
        driver: local

networks:
    proxy-network:
        driver: bridge
        name: kawashiro-proxy-network
