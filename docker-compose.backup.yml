services:
    # バックアップサービス（開発環境用）
    backup:
        build:
            context: ./backup
            dockerfile: Dockerfile
        image: backup
        container_name: backup
        hostname: backup
        # バックアップ専用の環境変数ファイルを読み込む
        env_file:
            - .env.backup
        environment:
            # Django API設定（デフォルト値、.env.backupで上書き可能）
            DJANGO_API_URL: http://django-api:8000
            # Django SQLite バックアップ設定
            DJANGO_SQLITE_PATH: /source/django/db.sqlite3
        volumes:
            # ソースコードのマウント（開発環境用）
            - ./backup/scripts:/app/scripts
            - ./backup/pyproject.toml:/app/pyproject.toml:ro
            # Django SQLite（読み取り専用 - バックアップ用）
            - ./volumes/django-api/db.sqlite3:/source/django/db.sqlite3:ro
            # バックアップ出力先
            - ./volumes/backup:/backup
        networks:
            - proxy-network

networks:
    # 既存のproxy-networkを参照
    proxy-network:
        external: true
