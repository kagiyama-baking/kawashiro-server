services:
    # Immichバックアップサービス
    immich-backup:
        build:
            context: ./backup
            dockerfile: Dockerfile
        image: immich-backup
        container_name: immich-backup
        hostname: immich-backup
        # バックアップ専用の環境変数ファイルを読み込む
        env_file:
            - .env.backup
        environment:
            # PostgreSQL接続情報
            DB_HOSTNAME: immich-postgres
            # Django API設定
            DJANGO_API_URL: http://django-api:8000
        volumes:
            # Immichの写真データ（読み取り専用）
            - ./volumes/immich/data:/source/data:ro
            # バックアップ出力先
            - ./volumes/backup:/backup
            # バックアップスクリプト
            - ./backup/scripts:/scripts:ro
        networks:
            - proxy-network

networks:
    # 既存のproxy-networkを参照
    proxy-network:
        external: true
