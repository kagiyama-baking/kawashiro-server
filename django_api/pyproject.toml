[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-api"
version = "0.1.0"
description = "Kawashiro Server Django API"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0",
    "djangorestframework>=3.16.1",
    "drf-spectacular>=0.28.0",
    "gunicorn>=23.0.0",
    "msal>=1.32.3",
    "pillow>=12.0.0",
    "pillow-heif>=0.20.0",
    "python-dotenv>=1.1.0",
    "requests>=2.32.3",
    "whitenoise>=6.8.2",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "faker>=38.2.0",
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "pytest-django>=4.11.1",
    "pytest-mock>=3.15.1",
    "ruff>=0.14.6",
]

[tool.setuptools]
packages = ["django_api", "core", "user", "onedrive", "media", "tts"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "django_api.settings"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers"
]

[tool.ruff]
target-version = "py313"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "migrations",
    "*.egg-info",
    ".pytest_cache",
    ".coverage",
    "htmlcov",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DJ",  # flake8-django
    "PIE", # flake8-pie
    "SIM", # flake8-simplify
]
ignore = [
    "DJ001", # null=True on string-based fields (sometimes necessary)
    "E501",  # line too long (日本語コメントを含むため)
]

[tool.ruff.lint.isort]
known-first-party = ["django_api", "core", "user", "onedrive", "media", "tts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
