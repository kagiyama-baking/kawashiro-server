[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-api"
version = "0.1.0"
description = "Kawashiro Server Django API"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2.7",
    "djangorestframework>=3.16.1",
    "drf-spectacular>=0.28.0",
    "gunicorn>=23.0.0",
    "msal>=1.32.3",
    "python-dotenv>=1.1.0",
    "requests>=2.32.3",
    "whitenoise>=6.8.2",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "faker>=38.2.0",
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "pytest-django>=4.11.1",
    "pytest-mock>=3.15.1",
]

[tool.setuptools]
packages = ["django_api", "core", "user", "onedrive"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "django_api.settings"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers"
]
