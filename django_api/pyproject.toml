[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-api"
version = "0.1.0"
description = "Kawashiro Server Django API"
requires-python = ">=3.13"
dependencies = [
    "celery[redis]>=5.4.0",
    "django>=6.0.3",
    "django-celery-beat>=2.7.0",
    "djangorestframework>=3.16.1",
    "drf-spectacular>=0.28.0",
    "gunicorn>=23.0.0",
    "img2pdf>=0.5.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langfuse>=3.0.0,<4.0.0",
    "langgraph>=0.4.0",
    "msal>=1.32.3",
    "openai>=2.14.0",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2.0",
    "pillow>=12.0.0",
    "pillow-heif>=0.20.0",
    "python-dotenv>=1.1.0",
    "requests>=2.32.3",
    "slack-sdk>=3.33.0",
    "urllib3>=2.6.3",
    "whitenoise>=6.8.2",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "faker>=38.2.0",
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "pytest-django>=4.11.1",
    "pytest-mock>=3.15.1",
    "pytest-xdist>=3.6.0",
    "ruff>=0.14.6",
]

[tool.setuptools.packages.find]
include = ["django_api*", "core*", "user*", "integrations*", "features*", "health*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "django_api.settings"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests"]
addopts = [
    "--tb=short",
    "--strict-markers",
    "-n",
    "auto",
    "-m",
    "not e2e",
]
markers = [
    "unit: 単体テスト（DBアクセスなし）",
    "integration: 統合テスト（DBアクセスあり）",
    "api: APIエンドポイントテスト",
    "slow: 実行が遅いテスト",
    "e2e: E2Eテスト（外部サービスアクセス）",
]

[tool.ruff]
target-version = "py313"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "migrations",
    "*.egg-info",
    ".pytest_cache",
    ".coverage",
    "htmlcov",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DJ",  # flake8-django
    "PIE", # flake8-pie
    "SIM", # flake8-simplify
]
ignore = [
    "DJ001", # null=True on string-based fields (sometimes necessary)
    "E501",  # line too long (日本語コメントを含むため)
]

[tool.ruff.lint.isort]
known-first-party = ["django_api", "core", "user", "integrations", "features", "health"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
