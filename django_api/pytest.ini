[pytest]
DJANGO_SETTINGS_MODULE = django_api.settings
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
testpaths = tests
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=user
    --cov=onedrive
    --cov=core
    --cov-report=term-missing
    --cov-report=html
    --cov-config=.coveragerc
markers =
    unit: Unit tests that don't require database
    integration: Integration tests that may require database
    api: API endpoint tests
    slow: Tests that take longer time to execute