services:
    # ============================================================
    # アプリケーションサービス
    # ============================================================

    # Django APIサーバー
    django-api:
        build:
            context: ./django_api
            dockerfile: Dockerfile
        image: django-api
        container_name: django
        hostname: django-api
        ports:
            # 開発環境用：直接アクセス
            - '8000:8000'
        volumes:
            # ソースコードのマウント（開発環境用）
            - ./django_api/manage.py:/django_api/manage.py
            - ./django_api/django_api:/django_api/django_api
            - ./django_api/core:/django_api/core
            - ./django_api/user:/django_api/user
            - ./django_api/integrations:/django_api/integrations
            - ./django_api/features:/django_api/features
            - ./django_api/health:/django_api/health
            # 環境変数ファイル
            - ./django_api/.env:/django_api/.env
            # 静的ファイルの永続化
            - /opt/app/django-api/staticfiles:/django_api/staticfiles
            # SQLiteデータベースの永続化
            - /opt/app/django-api/db.sqlite3:/django_api/db.sqlite3
        restart: unless-stopped
        networks:
            - container-network
        command: >
            sh -c "python manage.py rename_app_migrations generate talk &&
                   python manage.py migrate &&
                   python manage.py collectstatic --noinput &&
                   python manage.py runserver 0.0.0.0:8000"

    # Style-BERT-VITS2 読み上げAPI（GPU版）
    sbv2-api:
        build:
            context: ./sbv2_api
            dockerfile: Dockerfile
        image: sbv2-api
        container_name: sbv2-api
        hostname: sbv2-api
        ports:
            - '5000:5000'
        volumes:
            # ソースコードのマウント（開発環境用）
            - ./sbv2_api/server.py:/app/server.py
            # 設定ファイル
            - ./sbv2_api/config.yml:/app/config.yml:ro
            # 学習済みモデル（読み取り専用）
            - /opt/app/sbv2-api/model_assets:/app/model_assets:ro
        environment:
            - TZ=Asia/Tokyo
            - NVIDIA_VISIBLE_DEVICES=all
        restart: unless-stopped
        networks:
            - container-network
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: 1
                          capabilities: [gpu]

    # フロントエンド（React SPA）
    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        image: frontend
        container_name: frontend
        hostname: frontend
        ports:
            - '3000:80'
        volumes:
            # バナー画像の差し替え用（ホスト側のファイルでコンテナ内を上書き）
            - ./frontend/public/banner.jpg:/usr/share/nginx/html/banner.jpg:ro
        restart: unless-stopped
        networks:
            - container-network
        depends_on:
            - django-api

networks:
    container-network:
        driver: bridge
        name: container-network
