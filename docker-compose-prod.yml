services:
    # リバースプロキシサーバー
    reverse-proxy:
        image: ghcr.io/kagiyama-baking/kawashiro-server/reverse-proxy:release
        container_name: reverse-proxy
        hostname: reverse-proxy
        ports:
            - '80:8080'
            # HTTPS用（必要に応じてコメントアウトを解除）
            # - "443:443"
        volumes:
            # ログの永続化
            - ./volumes/reverse-proxy/log/nginx:/var/log/nginx
        restart: unless-stopped
        depends_on:
            - django-api
            - immich
        networks:
            - proxy-network

    # Django API サーバー
    django-api:
        image: ghcr.io/kagiyama-baking/kawashiro-server/django-api:release
        container_name: django-api
        hostname: django-api
        env_file:
            - .env
        volumes:
            # 環境変数ファイル
            - ./django_api/.env:/django_api/.env
            # ログの永続化
            - ./volumes/django-api/log:/django_api/logs
            # 静的ファイルの永続化
            - ./volumes/django-api/staticfiles:/django_api/staticfiles
            # SQLiteデータベースの永続化
            - ./volumes/django-api/db.sqlite3:/django_api/db.sqlite3
        restart: unless-stopped
        depends_on:
            - sbv2-api
        networks:
            - proxy-network
        command: >
            sh -c "python manage.py migrate &&
                   python manage.py collectstatic --noinput &&
                   gunicorn django_api.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 1200"

    # Style-BERT-VITS2 読み上げAPI
    # ※ローカルビルド（イメージサイズが大きいためGHCRを使用しない）
    sbv2-api:
        build:
            context: ./sbv2_api
            dockerfile: Dockerfile
        image: sbv2-api:local
        container_name: sbv2-api
        hostname: sbv2-api
        volumes:
            # 学習済みモデル（読み取り専用）
            - ./volumes/sbv2-api/model_assets:/app/model_assets:ro
            # 設定ファイル
            - ./sbv2_api/config.yml:/app/config.yml:ro
            # ログ
            - ./volumes/sbv2-api/log:/app/logs
        environment:
            - TZ=Asia/Tokyo
            - OMP_NUM_THREADS=4
            - MKL_NUM_THREADS=4
        restart: unless-stopped
        networks:
            - proxy-network
        # Intel Mac対応
        platform: linux/amd64

    # Immich - 写真管理サービス
    immich:
        image: ghcr.io/immich-app/immich-server:release
        container_name: immich
        hostname: immich
        environment:
            # Docker Composeサービス名を使用
            DB_HOSTNAME: immich-postgres
            REDIS_HOSTNAME: immich-redis
        env_file:
            - .env
        volumes:
            # アップロードファイルの永続化
            - ./volumes/immich/data:/data
            # ログディレクトリの作成（アプリケーションログ用）
            - ./volumes/immich/log:/logs
            # タイムゾーン設定
            - /etc/localtime:/etc/localtime:ro
        depends_on:
            - immich-redis
            - immich-postgres
        restart: unless-stopped
        networks:
            - proxy-network

    # Immich Machine Learning
    immich-machine-learning:
        image: ghcr.io/immich-app/immich-machine-learning:release
        container_name: immich-ml
        hostname: immich-ml
        environment:
            # Docker Composeサービス名を使用
            DB_HOSTNAME: immich-postgres
            REDIS_HOSTNAME: immich-redis
        env_file:
            - .env
        volumes:
            # モデルキャッシュの永続化
            - immich-ml-cache:/cache
        restart: unless-stopped
        networks:
            - proxy-network

    # Redis for Immich
    immich-redis:
        image: docker.io/valkey/valkey:8-bookworm
        container_name: immich-redis
        hostname: immich-redis
        healthcheck:
            test: redis-cli ping || exit 1
        volumes:
            # Redisデータの永続化
            - immich-redis-data:/data
        restart: unless-stopped
        networks:
            - proxy-network

    # PostgreSQL for Immich
    immich-postgres:
        image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
        container_name: immich-postgres
        hostname: immich-postgres
        environment:
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_DB: ${DB_DATABASE_NAME}
            POSTGRES_INITDB_ARGS: '--data-checksums'
        volumes:
            # PostgreSQLデータの永続化
            - immich-pgdata:/var/lib/postgresql/data
        shm_size: 128mb
        restart: unless-stopped
        networks:
            - proxy-network

networks:
    proxy-network:
        driver: bridge
        name: proxy-network

volumes:
    immich-pgdata:
        name: immich-pgdata
    immich-redis-data:
        name: immich-redis-data
    immich-ml-cache:
        name: immich-ml-cache

secrets:
    django_api_graph_key:
        file: ./secrets/django_api_graph_key.pem
