services:
    # ============================================================
    # アプリケーションサービス
    # ============================================================

    # リバースプロキシサーバー
    reverse-proxy:
        image: ghcr.io/kagiyama-baking/kawashiro-server/reverse-proxy:release
        container_name: reverse-proxy
        hostname: reverse-proxy
        ports:
            - '80:8080'
            # HTTPS用（必要に応じてコメントアウトを解除）
            # - "443:443"
        volumes:
            # ログの永続化
            - ./volumes/reverse-proxy/log/nginx:/var/log/nginx
        restart: unless-stopped
        depends_on:
            - django-api
            - immich
        networks:
            - proxy-network

    # Django API サーバー
    django-api:
        image: ghcr.io/kagiyama-baking/kawashiro-server/django-api:release
        container_name: django-api
        hostname: django-api
        env_file:
            - .env
        volumes:
            # 環境変数ファイル
            - ./django_api/.env:/django_api/.env
            # ログの永続化
            - ./volumes/django-api/log:/django_api/logs
            # 静的ファイルの永続化
            - ./volumes/django-api/staticfiles:/django_api/staticfiles
            # SQLiteデータベースの永続化
            - ./volumes/django-api/db.sqlite3:/django_api/db.sqlite3
        environment:
            # OpenTelemetry トレーシング設定
            OTEL_SERVICE_NAME: django-api
            OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
        restart: unless-stopped
        depends_on:
            - sbv2-api
        networks:
            - proxy-network
        command: >
            sh -c "python manage.py migrate &&
                   python manage.py collectstatic --noinput &&
                   gunicorn django_api.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 1200"

    # Style-BERT-VITS2 読み上げAPI
    # ※ローカルビルド（イメージサイズが大きいためGHCRを使用しない）
    sbv2-api:
        build:
            context: ./sbv2_api
            dockerfile: Dockerfile
        image: sbv2-api:local
        container_name: sbv2-api
        hostname: sbv2-api
        volumes:
            # 学習済みモデル（読み取り専用）
            - ./volumes/sbv2-api/model_assets:/app/model_assets:ro
            # 設定ファイル
            - ./sbv2_api/config.yml:/app/config.yml:ro
            # ログ
            - ./volumes/sbv2-api/log:/app/logs
        environment:
            - TZ=Asia/Tokyo
            - OMP_NUM_THREADS=4
            - MKL_NUM_THREADS=4
        restart: unless-stopped
        networks:
            - proxy-network
        # Intel Mac対応
        platform: linux/amd64

    # Immich - 写真管理サービス
    immich:
        image: ghcr.io/immich-app/immich-server:release
        container_name: immich
        hostname: immich
        environment:
            # Docker Composeサービス名を使用
            DB_HOSTNAME: immich-postgres
            REDIS_HOSTNAME: immich-redis
        env_file:
            - .env
        volumes:
            # アップロードファイルの永続化
            - ./volumes/immich/data:/data
            # ログディレクトリの作成（アプリケーションログ用）
            - ./volumes/immich/log:/logs
            # タイムゾーン設定
            - /etc/localtime:/etc/localtime:ro
        depends_on:
            - immich-redis
            - immich-postgres
        restart: unless-stopped
        networks:
            - proxy-network

    # Immich Machine Learning
    immich-machine-learning:
        image: ghcr.io/immich-app/immich-machine-learning:release
        container_name: immich-ml
        hostname: immich-ml
        environment:
            # Docker Composeサービス名を使用
            DB_HOSTNAME: immich-postgres
            REDIS_HOSTNAME: immich-redis
        env_file:
            - .env
        volumes:
            # モデルキャッシュの永続化
            - immich-ml-cache:/cache
        restart: unless-stopped
        networks:
            - proxy-network

    # Redis for Immich
    immich-redis:
        image: docker.io/valkey/valkey:8-bookworm
        container_name: immich-redis
        hostname: immich-redis
        healthcheck:
            test: redis-cli ping || exit 1
        volumes:
            # Redisデータの永続化
            - immich-redis-data:/data
        restart: unless-stopped
        networks:
            - proxy-network

    # PostgreSQL for Immich
    immich-postgres:
        image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
        container_name: immich-postgres
        hostname: immich-postgres
        environment:
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_DB: ${DB_DATABASE_NAME}
            POSTGRES_INITDB_ARGS: '--data-checksums'
        volumes:
            # PostgreSQLデータの永続化
            - immich-pgdata:/var/lib/postgresql/data
        shm_size: 128mb
        restart: unless-stopped
        networks:
            - proxy-network

    # ============================================================
    # 監視・オブザーバビリティ
    # ============================================================

    # Prometheus - メトリクス収集サーバー
    # ※ 公式イメージをそのまま使用（設定ファイルはボリュームマウント）
    prometheus:
        image: prom/prometheus:v3.9.1
        container_name: prometheus
        hostname: prometheus
        volumes:
            # 設定ファイルのマウント
            - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            # データの永続化
            - prometheus-data:/prometheus
        command:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--storage.tsdb.retention.time=30d'
            - '--web.console.libraries=/usr/share/prometheus/console_libraries'
            - '--web.console.templates=/usr/share/prometheus/consoles'
        healthcheck:
            test:
                [
                    'CMD',
                    'wget',
                    '--quiet',
                    '--tries=1',
                    '--spider',
                    'http://localhost:9090/-/healthy',
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s
        restart: unless-stopped
        networks:
            - proxy-network

    # Grafana - 監視ダッシュボード
    # ※ 公式イメージをそのまま使用（プロビジョニング設定はボリュームマウント）
    grafana:
        image: grafana/grafana:12.3.3
        container_name: grafana
        hostname: grafana
        env_file:
            - .env
        volumes:
            # プロビジョニング設定のマウント
            - ./grafana/provisioning:/etc/grafana/provisioning:ro
            # データの永続化
            - grafana-data:/var/lib/grafana
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1',
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s
        restart: unless-stopped
        depends_on:
            - prometheus
            - loki
            - tempo
        networks:
            - proxy-network

    # Loki - ログ集約サーバー
    # ※ 公式イメージをそのまま使用（設定ファイルはボリュームマウント）
    loki:
        image: grafana/loki:3.6.6
        container_name: loki
        hostname: loki
        volumes:
            # 設定ファイルのマウント
            - ./loki/loki.yml:/etc/loki/loki.yml:ro
            # データの永続化
            - loki-data:/loki
        command:
            - '-config.file=/etc/loki/loki.yml'
        # NOTE: Loki は distroless イメージのため healthcheck 設定不可
        restart: unless-stopped
        networks:
            - proxy-network

    # Tempo - 分散トレーシングバックエンド
    # ※ 公式イメージをそのまま使用（設定ファイルはボリュームマウント）
    tempo:
        image: grafana/tempo:2.10.1
        container_name: tempo
        hostname: tempo
        volumes:
            # 設定ファイルのマウント
            - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
            # データの永続化
            - tempo-data:/var/tempo
        command:
            - '-config.file=/etc/tempo/tempo.yml'
        # NOTE: Tempo 2.10+ は distroless イメージのため healthcheck 設定不可
        restart: unless-stopped
        networks:
            - proxy-network

    # Promtail - ログ収集エージェント
    # ※ 公式イメージをそのまま使用（設定ファイルはボリュームマウント）
    promtail:
        image: grafana/promtail:3.6.6
        container_name: promtail
        hostname: promtail
        volumes:
            # 設定ファイルのマウント
            - ./promtail/promtail.yml:/etc/promtail/promtail.yml:ro
            # Nginxログへのアクセス（読み取り専用）
            - ./volumes/reverse-proxy/log/nginx:/var/log/nginx:ro
            # Dockerソケット（コンテナログ自動収集用、読み取り専用）
            - /var/run/docker.sock:/var/run/docker.sock:ro
        command:
            - '-config.file=/etc/promtail/promtail.yml'
        # NOTE: Promtail は distroless イメージのため healthcheck 設定不可
        restart: unless-stopped
        depends_on:
            - loki
            - reverse-proxy
        networks:
            - proxy-network

    # cAdvisor - Dockerコンテナメトリクス収集（本番環境のみ）
    cadvisor:
        image: gcr.io/cadvisor/cadvisor:v0.55.1
        container_name: cadvisor
        hostname: cadvisor
        volumes:
            - /:/rootfs:ro
            - /var/run/docker.sock:/var/run/docker.sock:ro # Docker ソケット（macOS Docker Desktopではシンボリックリンク解決のため明示的にマウント）
            - /run/containerd:/run/containerd:ro # containerd ソケット（Docker factory登録に必要）
            - /sys:/sys:ro
            - /var/lib/docker/:/var/lib/docker:ro
            - /dev/disk/:/dev/disk:ro
        # privileged: true の代わりに必要最小限の権限を付与
        security_opt:
            - no-new-privileges:true
        devices:
            - /dev/kmsg
        healthcheck:
            test:
                [
                    'CMD',
                    'wget',
                    '--quiet',
                    '--tries=1',
                    '--spider',
                    'http://localhost:8080/healthz',
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s
        restart: unless-stopped
        networks:
            - proxy-network

    # Node Exporter - ホストマシンメトリクス収集
    node-exporter:
        image: prom/node-exporter:v1.10.2
        container_name: node-exporter
        hostname: node-exporter
        volumes:
            - /proc:/host/proc:ro
            - /sys:/host/sys:ro
            - /:/rootfs:ro
        command:
            - '--path.procfs=/host/proc'
            - '--path.rootfs=/rootfs'
            - '--path.sysfs=/host/sys'
            - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
        healthcheck:
            # --spider は broken pipe を引き起こすため -O /dev/null で出力を破棄
            test:
                [
                    'CMD-SHELL',
                    'wget --quiet --tries=1 -O /dev/null http://localhost:9100/metrics || exit 1',
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s
        restart: unless-stopped
        networks:
            - proxy-network

    # Nginx Exporter - Nginxメトリクス収集
    nginx-exporter:
        image: nginx/nginx-prometheus-exporter:1.5.0
        container_name: nginx-exporter
        hostname: nginx-exporter
        command:
            - '--nginx.scrape-uri=http://reverse-proxy:8080/stub_status'
        # NOTE: nginx-exporter は distroless イメージのため healthcheck 設定不可
        restart: unless-stopped
        depends_on:
            - reverse-proxy
        networks:
            - proxy-network

networks:
    proxy-network:
        driver: bridge
        name: proxy-network

volumes:
    immich-pgdata:
        name: immich-pgdata
    immich-redis-data:
        name: immich-redis-data
    immich-ml-cache:
        name: immich-ml-cache
    prometheus-data:
        name: prometheus-data
    grafana-data:
        name: grafana-data
    loki-data:
        name: loki-data
    tempo-data:
        name: tempo-data

secrets:
    django_api_graph_key:
        file: ./secrets/django_api_graph_key.pem
